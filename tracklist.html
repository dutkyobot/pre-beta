<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>트랙리스트 | Dutkyobot</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">

<style>
  :root{
    --bg:#000000;
    --surface:#18181B;
    --line:#2A2A2E;
    --ink:#FFFFFF;
    --mute:#9B9BA3;
    --dim:#6B6B72;
    --accent:#A5AFB8;
    --blue:#A5AFB8;
    --bar-space:112px;
  }

  *{ box-sizing:border-box; }
  [hidden]{ display:none !important; }

  html,body{ margin:0; background:var(--bg); color:var(--ink); }
  body{
    font-family:"Pretendard Variable","Pretendard",-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--bar-space) + 36px);
  }
  button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  input,textarea{ font:inherit; }

  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible{
    outline:2px solid var(--blue);
    outline-offset:2px;
    border-radius:4px;
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:28px;
  }
  .label{
    font-size:11px; font-weight:600;
    letter-spacing:0.1em; text-transform:uppercase;
    color:var(--mute);
  }

  /* ============================== 전체 레이아웃 ============================== */
  .app{
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:12px;
  }
  .rail{ display:none; }
  .main{ display:flex; flex-direction:column; gap:12px; min-width:0; }
  .panel{ order:-1; min-width:0; overflow:hidden; }

  @media (min-width:1024px){
    html,body{ height:100%; overflow:hidden; }
    body{ padding-bottom:0; }
    .app{
      display:grid;
      grid-template-columns:var(--rail-width) var(--player-width) minmax(0,1fr);
      gap:var(--desktop-gap);
      height:100vh;
      padding:var(--desktop-inset);
    }
    .rail{
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:18px 0 var(--bar-space);
      min-height:0;
      overflow:hidden;
    }
    .panel{ order:0; align-self:start; max-height:100%; overflow-y:auto; scrollbar-width:thin; }
    .main{ overflow-y:auto; padding-bottom:var(--bar-space); scrollbar-width:thin; }
  }

  /* ============================== 왼쪽 라이브러리 줄 ============================== */
  .rail-logo{
    width:36px; height:36px;
    border-radius:10px;
    background:
      linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)),
      linear-gradient(135deg, #21D67A 0%, #3B9EFF 100%);
    color:rgba(0,0,0,0.8);
    display:flex; align-items:center; justify-content:center;
    font-size:14px;
  }
  .rail-btn{
    width:42px; height:42px;
    border-radius:9999px;
    border:1px solid var(--line);
    color:var(--mute);
    font-size:14px;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .15s, color .15s;
  }
  .rail-btn:hover{ border-color:rgba(255,255,255,0.3); color:#fff; }

  .lib{
    display:flex; flex-direction:column; align-items:center;
    gap:10px;
    width:100%;
    flex:1; min-height:0;
    overflow-y:auto;
    padding:4px 0;
    scrollbar-width:none;
  }
  .lib::-webkit-scrollbar{ display:none; }
  .lib-item, .lib-add{
    flex:none;
    width:48px; height:48px;
    border-radius:14px;
    padding:0;
    border:1px solid var(--line);
    transition:border-color .15s, transform .1s;
  }
  .lib-item:hover{ border-color:rgba(255,255,255,0.3); transform:scale(1.04); }
  .lib-item.active{ padding:2px; border-color:transparent; background:#7D8790; }
  .lib-in{
    display:block; position:relative;
    width:100%; height:100%;
    border-radius:12px;
    overflow:hidden;
    background:#000;
  }
  .lib-item.active .lib-in{ border-radius:11px; }
  .lib-ph{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:700; color:var(--mute);
  }
  .lib-in img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
  .lib-strip{
    display:flex; gap:10px;
    overflow-x:auto;
    padding:2px;
    scrollbar-width:none;
  }
  .lib-strip::-webkit-scrollbar{ display:none; }
  .lib-add{
    background:var(--surface);
    color:var(--mute);
    font-size:15px;
    display:flex; align-items:center; justify-content:center;
  }
  .lib-add:hover{ color:#fff; border-color:rgba(255,255,255,0.3); }
  @media (min-width:1024px){ .lib-strip{ display:none; } }

  .ctx{
    position:fixed; z-index:60;
    min-width:150px;
    padding:6px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.55);
  }
  .ctx button{
    display:flex; align-items:center; gap:10px;
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    font-size:13px; text-align:left;
  }
  .ctx button:hover{ background:rgba(255,255,255,0.05); }
  .ctx .danger{ color:#ff7a7a; }

  /* ============================== 가운데 패널 (영상 + 곡 정보 + 다음 곡) ============================== */
  .video-box{
    aspect-ratio:16/9;
    background:#000;
  }
  .video-box iframe{ width:100%; height:100%; display:block; }
  .panel-body{ padding:22px 24px 24px; }
  @media (min-width:1024px){ .panel-body{ padding-bottom:calc(var(--bar-space) + 8px); } }

  .now-row{ display:flex; align-items:center; gap:12px; margin-top:12px; min-width:0; }
  .now-title{ font-size:18px; font-weight:700; line-height:1.3; overflow-wrap:anywhere; letter-spacing:-0.01em; }
  .now-sub{ font-size:11px; color:var(--mute); margin-bottom:3px; font-variant-numeric:tabular-nums; }

  .next-card{
    margin-top:22px;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  @media (max-width:1023px){ .next-card{ display:none; } }
  .next-card .label{ margin:0 0 10px; }
  .next-item{
    display:grid;
    grid-template-columns:24px minmax(0,1fr) auto;
    gap:10px;
    align-items:center;
    width:100%;
    text-align:left;
    padding:10px 8px;
    border-radius:12px;
    font-size:13px;
    color:var(--mute);
    transition:background .12s;
  }
  .next-item:hover{ background:rgba(255,255,255,0.04); }
  .next-item .n{ text-align:right; font-variant-numeric:tabular-nums; }
  .next-item .t{ color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .next-item .d{ font-variant-numeric:tabular-nums; }
  .next-empty{ padding:8px; font-size:13px; color:var(--dim); }

  /* ============================== 오른쪽 메인 (헤더 카드 + 곡 목록 카드) ============================== */
  .hero{
    display:flex;
    align-items:center;
    gap:20px;
    padding:24px;
  }
  .cover{
    flex:none;
    width:104px; height:104px;
    border-radius:20px;
    border:1px solid var(--line);
    overflow:hidden;
    background:#000;
  }
  .cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .hero-text{ min-width:0; }
  .pl-title{
    margin:8px 0 6px;
    font-size:clamp(24px, 4vw, 38px);
    font-weight:700;
    line-height:1.2;
    letter-spacing:-0.02em;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
    overflow-wrap:anywhere;
  }
  .pl-meta{ font-size:13px; color:var(--mute); }
  @media (min-width:640px){
    .hero{ padding:32px; gap:28px; }
    .cover{ width:148px; height:148px; border-radius:24px; }
  }

  /* 보조 재생 컨트롤 */
  .ctl{
    width:46px; height:46px;
    border-radius:9999px;
    border:1px solid var(--line);
    background:var(--surface);
    color:#fff;
    font-size:14px;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    transition:border-color .15s, background .15s, color .15s;
  }
  .ctl:hover{ border-color:rgba(255,255,255,0.3); }
  .ctl[aria-pressed="true"], .ctl[data-on="true"]{
    background:#343A40;
    border-color:#525B64;
    color:#F1F3F5;
  }
  .ctl[data-mode="one"]::before{
    content:"1";
    position:absolute; top:7px; right:10px;
    font-size:9px; font-weight:800;
  }

  /* 곡 목록 */
  .list-card{ overflow:hidden; }
  .list-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 24px;
    border-bottom:1px solid var(--line);
  }
  .list-head h2{ margin:0; font-size:14px; font-weight:700; }
  .list-head span{ font-size:12px; color:var(--mute); }

  .track-row{
    display:grid;
    grid-template-columns:28px minmax(0,1fr) 56px;
    align-items:center;
    gap:12px;
    padding:12px 18px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    font-size:14px;
    color:var(--mute);
    transition:background .12s;
  }
  .track-row:last-child{ border-bottom:none; }
  .track-row:hover{ background:rgba(255,255,255,0.03); }
  .track-row.dragging{ opacity:.4; }
  .track-row.active{ background:rgba(255,255,255,0.055); }
  .c-start, .c-act{ display:none; }
  @media (min-width:640px){
    .track-row{ grid-template-columns:28px minmax(0,1fr) 64px 56px 60px; padding:12px 24px; }
    .c-start{ display:block; }
    .c-act{ display:block; }
  }
  .track-row .c-num{
    text-align:right;
    font-size:12px;
    font-variant-numeric:tabular-nums;
    display:flex; justify-content:flex-end; align-items:center;
  }
  .track-row.active .num{ display:none; }
  .track-row .hov{ display:none; color:var(--mute); font-size:10px; }
  .track-row:hover .num{ display:none; }
  .track-row:hover .hov{ display:inline; }
  .track-row.active:hover .eq{ display:none; }
  .c-title .t{
    color:#fff;
    font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    display:block;
  }
  .track-row.active .c-title .t{ font-weight:700; }
  .c-start, .c-len{ font-size:12px; font-variant-numeric:tabular-nums; }
  .c-len{ text-align:right; }
  .c-act{
    opacity:0;
    text-align:right;
    white-space:nowrap;
    transition:opacity .12s;
  }
  .track-row:hover .c-act{ opacity:1; }
  .mini-btn{
    width:26px; height:26px;
    border-radius:8px;
    border:1px solid var(--line);
    background:#000;
    color:var(--mute);
    font-size:10px;
    transition:border-color .15s, color .15s;
  }
  .mini-btn:hover{ border-color:rgba(255,255,255,0.3); color:#fff; }

  .eq{ display:flex; align-items:flex-end; gap:2px; height:14px; }
  .eq span{
    width:3px; border-radius:1px;
    background:
      linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)),
      linear-gradient(180deg, #21D67A, #3B9EFF);
    animation:eq 1s ease-in-out infinite;
  }
  .eq span:nth-child(1){ height:40%; animation-delay:-0.6s; }
  .eq span:nth-child(2){ height:100%; animation-delay:-0.2s; }
  .eq span:nth-child(3){ height:65%; animation-delay:-0.9s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(0.4); } 50%{ transform:scaleY(1); } }
  body.is-paused .eq span{ animation-play-state:paused; }

  /* ============================== 플로팅 재생바 ============================== */
  .bar{
    position:fixed;
    left:50%;
    bottom:16px;
    transform:translateX(-50%);
    width:min(1180px, calc(100% - 24px));
    z-index:20;
    display:grid;
    grid-template-columns:minmax(0,1fr);
    gap:10px;
    padding:14px 18px;
    background:rgba(24,24,27,0.88);
    -webkit-backdrop-filter:blur(22px) saturate(1.4);
    backdrop-filter:blur(22px) saturate(1.4);
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:0 12px 40px rgba(0,0,0,0.6);
  }
  @media (min-width:900px){
    .bar{
      grid-template-columns:minmax(0,1fr) minmax(320px,560px) minmax(0,1fr);
      align-items:center;
      gap:16px;
      padding:12px 24px 12px 16px;
    }
  }
  .bar-info{ display:flex; align-items:center; gap:12px; min-width:0; }
  .bar-thumb{
    flex:none;
    width:48px; height:48px;
    border-radius:14px;
    border:1px solid var(--line);
    overflow:hidden;
    background:#000;
  }
  .bar-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .bar-text{ min-width:0; }
  .bar-title{ font-size:14px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-sub{ font-size:12px; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }

  .bar-center{ display:flex; flex-direction:column; gap:8px; min-width:0; }
  .bar-btns{ display:flex; align-items:center; justify-content:center; gap:10px; }
  .bar-btns .ctl{ width:38px; height:38px; font-size:12px; }
  .play-btn{
    width:46px; height:46px;
    border-radius:9999px;
    background:
      linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)),
      linear-gradient(135deg, #21D67A 0%, #3B9EFF 100%);
    color:#101418;
    font-size:15px;
    display:flex; align-items:center; justify-content:center;
    transition:opacity .2s, transform .1s;
  }
  .play-btn:hover{ opacity:.88; }
  .play-btn:active{ transform:translateY(1px); }
  .play-btn .fa-play{ margin-left:2px; }

  .seek{ display:flex; align-items:center; gap:10px; font-size:11px; color:var(--mute); font-variant-numeric:tabular-nums; }
  .seek span{ width:38px; flex:none; }
  .seek span:first-child{ text-align:right; }

  input[type=range]{
    -webkit-appearance:none; appearance:none;
    flex:1; min-width:0;
    height:14px;
    background:transparent;
    cursor:pointer;
    --p:0%;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px; border-radius:9999px;
    background:linear-gradient(90deg, var(--accent) 0%, var(--accent) 100%) 0 / var(--p) 100% no-repeat, #3A3F45;
  }
  input[type=range]::-moz-range-track{ height:4px; border-radius:9999px; background:#3A3F45; }
  input[type=range]::-moz-range-progress{ height:4px; border-radius:9999px; background:var(--accent); }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none;
    width:12px; height:12px;
    margin-top:-4px;
    border-radius:9999px;
    background:#fff;
    box-shadow:0 0 0 3px rgba(0,0,0,0.35);
  }
  input[type=range]::-moz-range-thumb{ width:12px; height:12px; border:0; border-radius:9999px; background:#fff; }
  input[type=range]:disabled{ opacity:.4; cursor:default; }

  .bar-right{ display:none; align-items:center; justify-content:flex-end; gap:10px; }
  @media (min-width:900px){ .bar-right{ display:flex; } }
  .bar-right .ctl{ width:38px; height:38px; font-size:13px; }
  .bar-right input[type=range]{ flex:none; width:96px; }

  /* ============================== 플레이리스트 추가 입력창 ============================== */
  .modal{
    position:fixed; inset:0;
    z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:16px;
    background:rgba(0,0,0,0.78);
    -webkit-backdrop-filter:blur(6px);
    backdrop-filter:blur(6px);
    overflow-y:auto;
  }
  .modal-card{
    position:relative;
    width:100%; max-width:520px;
    max-height:100%;
    overflow-y:auto;
    padding:32px;
  }
  @media (min-width:640px){ .modal-card{ padding:40px; } }
  .modal-close{
    position:absolute; top:18px; right:18px;
    width:34px; height:34px;
    border-radius:9999px;
    border:1px solid var(--line);
    color:var(--mute);
    transition:border-color .15s, color .15s;
  }
  .modal-close:hover{ border-color:rgba(255,255,255,0.3); color:#fff; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom:26px; }
  .brand .logo{
    width:32px; height:32px; border-radius:8px;
    background:
      linear-gradient(rgba(255,255,255,0.2), rgba(255,255,255,0.2)),
      linear-gradient(135deg, #21D67A 0%, #3B9EFF 100%);
    color:rgba(0,0,0,0.8);
    display:flex; align-items:center; justify-content:center; font-size:12px;
  }
  .brand b{ font-size:18px; letter-spacing:-0.01em; }
  .modal-card h1{ margin:0; font-size:28px; line-height:1.25; letter-spacing:-0.02em; }
  .modal-card p.lead{ margin:12px 0 0; color:var(--mute); font-size:15px; line-height:1.6; }
  .field{ margin-top:22px; }
  .field label{ display:block; margin-bottom:6px; }
  .field-input{
    width:100%;
    background:#000;
    border:1px solid var(--line);
    border-radius:14px;
    padding:12px 14px;
    color:#fff; font-size:14px;
    outline:none;
    transition:border-color .15s;
  }
  .field-input::placeholder{ color:var(--dim); }
  .field-input:focus{ border-color:var(--blue); }
  textarea.field-input{ resize:vertical; min-height:180px; line-height:1.6; }
  .submit{
    margin-top:26px;
    padding:12px 24px;
    border-radius:9999px;
    background:#E5E8EB; color:#17191C;
    font-size:14px; font-weight:600;
    transition:opacity .2s, transform .1s;
  }
  .submit:hover{ opacity:.88; }
  .submit:active{ transform:translateY(1px); }
  .hint{
    margin:28px 0 0; padding-top:22px;
    border-top:1px solid var(--line);
    font-size:12px; color:var(--mute); line-height:1.7;
  }
  .copy{ margin-top:10px; font-size:12px; color:var(--dim); }
  .copy b{ color:var(--mute); }

  @media (prefers-reduced-motion: reduce){
    * { transition:none !important; animation-duration:0.001ms !important; }
  }

  /* ============================== UX refinement ============================== */
  :root{
    --surface:#15171b;
    --line:#292d33;
    --bar-space:128px;
    --desktop-inset:16px;
    --desktop-gap:16px;
    --rail-width:76px;
    --player-width:360px;
    --main-start:calc(var(--desktop-inset) + var(--rail-width) + var(--desktop-gap) + var(--player-width) + var(--desktop-gap));
  }
  .card{ border-radius:24px; }
  .panel-body{ padding-bottom:26px; }
  .hero{ min-height:172px; }
  .list-card{ border-radius:22px; }
  .list-head{ padding:18px 22px; }
  .list-head h2{ font-size:15px; }

  .list-toolbar{ display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); }
  .search-field{ position:relative; flex:1; width:auto; min-width:0; }
  .search-field > i{ position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--dim); font-size:13px; pointer-events:none; }
  .track-search{ display:block; width:100%; height:40px; padding:0 40px 0 38px; border:1px solid var(--line); border-radius:12px; background:#0d0e11; color:var(--ink); font-size:13px; outline:none; transition:border-color .15s,background .15s; }
  .track-search::placeholder{ color:var(--dim); }
  .track-search:focus{ border-color:var(--blue); background:#101216; }
  .track-search::-webkit-search-cancel-button{ display:none; }
  .search-clear{ position:absolute; right:7px; top:50%; transform:translateY(-50%); display:grid; place-items:center; width:28px; height:28px; border-radius:8px; color:var(--mute); }
  .search-clear:hover{ background:rgba(255,255,255,.08); color:#fff; }
  .search-count{ margin-left:auto; color:var(--mute); font-size:12px; white-space:nowrap; }

  .track-row{ grid-template-columns:minmax(0,1fr) 54px 72px; gap:8px; padding:10px 14px; cursor:default; }
  .track-play{ display:grid; grid-template-columns:28px minmax(0,1fr); align-items:center; gap:12px; width:100%; min-width:0; padding:3px 4px; border-radius:10px; color:inherit; text-align:left; }
  .track-play:hover .c-title .t{ color:#fff; }
  .track-play:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
  .track-row .c-num{ min-width:24px; }
  .track-row .c-title{ min-width:0; }
  .track-row .c-title .t{ font-size:14px; }
  .track-row .num{ display:inline; }
  .track-row .hov{ display:none; }
  .track-row:hover .num{ display:none; }
  .track-row:hover .hov{ display:inline-flex; align-items:center; justify-content:center; }
  .track-row.active .num{ display:none; }
  .track-row.active .eq,.track-row.active:hover .eq{ display:flex; }
  .track-row .c-start{ display:none; }
  .track-row .c-len{ text-align:right; font-size:12px; color:var(--mute); font-variant-numeric:tabular-nums; }
  .track-row .c-act{ display:flex; align-items:center; justify-content:flex-end; gap:4px; opacity:1; white-space:nowrap; }
  .mini-btn{ width:30px; height:32px; border-radius:9px; background:rgba(0,0,0,.22); font-size:10px; }
  .mini-btn:disabled{ opacity:.25; cursor:not-allowed; }
  .track-row:focus-within{ background:rgba(255,255,255,.035); }
  .list-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; min-height:132px; padding:24px; color:#fff; font-size:14px; text-align:center; }
  .list-empty span{ color:var(--mute); font-size:12px; }

  .lib-entry{ position:relative; flex:none; width:48px; height:48px; }
  .lib-remove{ position:absolute; z-index:2; top:-5px; right:-5px; display:grid; place-items:center; width:19px; height:19px; border:1px solid rgba(255,255,255,.18); border-radius:50%; background:#292d33; color:#e5e7eb; font-size:9px; opacity:0; transition:opacity .15s,background .15s; }
  .lib-entry:hover .lib-remove,.lib-entry:focus-within .lib-remove{ opacity:1; }
  .lib-remove:hover{ background:#a63c45; color:#fff; }
  .lib-strip .lib-remove{ opacity:1; }

  .field-help{ margin:7px 2px 0; color:var(--dim); font-size:12px; line-height:1.5; }
  .form-feedback{ margin:12px 0 0; color:#ff9c9c; font-size:13px; line-height:1.5; }
  .form-feedback[data-kind="success"]{ color:var(--accent); }
  .player-status{ margin:14px 0 0; padding:11px 13px; border:1px solid rgba(255,122,122,.2); border-radius:12px; background:rgba(255,80,80,.07); color:#ffb1b1; font-size:12px; line-height:1.5; }

  @media (min-width:640px){
    .track-row{ grid-template-columns:minmax(0,1fr) 68px 56px 72px; padding:12px 22px; }
    .track-row .c-start{ display:block; color:var(--mute); font-size:12px; font-variant-numeric:tabular-nums; }
    .track-row .c-act{ opacity:0; }
    .track-row:hover .c-act,.track-row:focus-within .c-act{ opacity:1; }
  }
  @media (max-width:639px){
    .hero{ padding:20px; gap:16px; }
    .cover{ width:88px; height:88px; border-radius:17px; }
    .list-head{ padding:16px 18px; }
    .list-toolbar{ padding:11px 14px; }
    .list-toolbar .search-field{ width:100%; }
    .search-count{ font-size:11px; }
    .track-row{ padding:10px 12px; }
    .track-play{ gap:8px; grid-template-columns:24px minmax(0,1fr); }
    .track-row .c-title .t{ font-size:13px; }
    .track-row .c-len{ font-size:11px; }
    .mini-btn{ width:29px; height:32px; }
    .lib-strip{ padding:5px 2px 8px; }
    .lib-remove{ opacity:1; }
  }
  @media (max-width:380px){
    .hero{ padding:16px; }
    .cover{ width:76px; height:76px; }
    .track-row{ grid-template-columns:minmax(0,1fr) 46px 66px; gap:6px; padding:9px; }
    .mini-btn{ width:27px; height:30px; }
    .bar{ width:calc(100% - 16px); padding:11px 12px; }
    .bar-btns{ gap:7px; }
  }
  @media (max-width:899px){
    .bar{ bottom:10px; border-radius:22px; padding:12px 14px; gap:8px; }
    .bar-thumb{ width:42px; height:42px; border-radius:12px; }
    .bar-btns{ gap:8px; }
    .bar-btns .ctl{ width:35px; height:35px; }
    .play-btn{ width:42px; height:42px; }
    .seek{ gap:8px; }
    .seek span{ width:34px; }
  }


  @media (min-width:1024px){
    .bar{
      left:calc(var(--main-start) - 6px);
      right:calc(var(--desktop-inset) - 6px);
      bottom:16px;
      width:auto;
      max-width:none;
      transform:none;
    }
  }

  /* Desktop: scroll the page, not a clipped inner grid column.
     The playlist can grow to its natural height while the player stays in view. */
  @media (min-width:1024px){
    html{
      height:auto;
      min-height:100%;
      overflow-x:hidden;
      overflow-y:auto;
    }
    body{
      height:auto;
      min-height:100%;
      overflow:visible;
    }
    .app{
      display:grid;
      grid-template-columns:var(--rail-width) var(--player-width) minmax(0,1fr);
      grid-template-rows:auto;
      align-items:start;
      gap:var(--desktop-gap);
      width:100%;
      height:auto;
      min-height:100vh;
      padding:var(--desktop-inset);
    }
    .rail{
      position:sticky;
      top:var(--desktop-inset);
      display:flex;
      flex-direction:column;
      align-items:center;
      align-self:start;
      gap:14px;
      width:var(--rail-width);
      height:max-content;
      min-height:0;
      max-height:calc(100dvh - 32px);
      overflow:hidden;
      padding:18px 0 16px;
    }
    .rail .lib{
      display:flex;
      flex:none;
      min-height:0;
      max-height:calc(100dvh - 150px);
      overflow-y:auto;
      overflow-x:hidden;
      scrollbar-width:thin;
    }
    .panel{
      position:sticky;
      top:var(--desktop-inset);
      display:block;
      width:var(--player-width);
      align-self:start;
      height:auto;
      max-height:calc(100dvh - 32px);
      overflow-y:auto;
      overflow-x:hidden;
      scrollbar-width:thin;
      overscroll-behavior:contain;
    }
    .panel-body{
      padding-bottom:28px;
    }
    .main{
      display:flex;
      flex-direction:column;
      flex:initial;
      width:auto;
      min-width:0;
      height:auto;
      min-height:0;
      overflow:visible;
      padding-bottom:calc(var(--bar-space) + 24px);
    }
  }

  /* Mobile: floating library above the playback bar; player info follows the list. */
  @media (max-width:1023px){
    body{ padding-bottom:calc(var(--bar-space) + 108px); }
    .panel{ order:2; }
    .lib-strip{
      position:fixed;
      left:12px;
      right:12px;
      bottom:calc(var(--bar-space) + 36px);
      z-index:19;
      align-items:center;
      justify-content:flex-start;
      gap:10px;
      min-height:62px;
      margin:0;
      padding:6px 10px;
      border:1px solid var(--line);
      border-radius:20px;
      background:rgba(21,23,27,.92);
      -webkit-backdrop-filter:blur(18px) saturate(1.25);
      backdrop-filter:blur(18px) saturate(1.25);
      box-shadow:0 10px 30px rgba(0,0,0,.42);
    }
  }
  @media (min-width:900px) and (max-width:1023px){
    body{ padding-bottom:190px; }
    .lib-strip{ bottom:112px; }
  }
  @media (max-width:380px){
    .lib-strip{ left:8px; right:8px; }
  }

</style>
</head>

<body>

<!-- ============================== 플레이어 화면 ============================== -->
<div id="app" class="app" hidden>

  <nav class="rail card" aria-label="라이브러리">
    <div class="rail-logo"><i class="fa-solid fa-list-ol"></i></div>
    <button id="railNew" class="rail-btn" aria-label="플레이리스트 추가" title="플레이리스트 추가"><i class="fa-solid fa-plus"></i></button>
    <div id="libRail" class="lib"></div>
  </nav>

  <aside class="panel card" aria-label="재생 중인 곡">
    <div class="video-box"><div id="player"></div></div>

    <div class="panel-body">
      <div class="label">지금 재생 중</div>
      <div class="now-row">
        <div style="min-width:0">
          <div id="nowSub" class="now-sub">—</div>
          <div id="nowTitle" class="now-title" aria-live="polite">재생 없음</div>
        </div>
      </div>
      <p id="playerStatus" class="player-status" role="status" hidden></p>

      <section class="next-card">
        <div class="label">다음 곡</div>
        <div id="nextList"></div>
      </section>
    </div>
  </aside>

  <div id="libStrip" class="lib-strip"></div>

  <main id="main" class="main">
    <section class="card">
      <header class="hero">
        <div class="cover" id="cover"></div>
        <div class="hero-text">
          <div class="label">플레이리스트</div>
          <h1 id="plTitle" class="pl-title">트랙리스트</h1>
          <div id="plMeta" class="pl-meta"></div>
        </div>
      </header>


    </section>

    <section class="card list-card">
      <div class="list-head">
        <h2>트랙리스트</h2>
        <span id="trackCount"></span>
      </div>
      <div class="list-toolbar" role="search" aria-label="트랙 검색">
        <div class="search-field">
          <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
          <input id="trackSearch" class="track-search" type="search" placeholder="곡 제목 검색" autocomplete="off" aria-label="곡 제목 검색">
          <button id="searchClear" class="search-clear" type="button" aria-label="검색어 지우기" hidden><i class="fa-solid fa-xmark"></i></button>
        </div>
        <span id="searchCount" class="search-count" aria-live="polite"></span>
      </div>
      <div id="list" role="list" aria-label="곡 목록"></div>
    </section>
  </main>
</div>

<!-- ============================== 플로팅 재생바 ============================== -->
<div id="bar" class="bar" hidden>
  <div class="bar-info">
    <div class="bar-thumb" id="barThumb"></div>
    <div class="bar-text">
      <div id="barTitle" class="bar-title">재생 없음</div>
      <div id="barSub" class="bar-sub"></div>
    </div>
  </div>

  <div class="bar-center">
    <div class="bar-btns">
      <button class="ctl js-shuffle" aria-label="셔플" aria-pressed="false"><i class="fa-solid fa-shuffle"></i></button>
      <button id="prevBtn" class="ctl" aria-label="이전 곡"><i class="fa-solid fa-backward-step"></i></button>
      <button id="playBtn" class="play-btn" aria-label="재생 / 일시정지"><i class="fa-solid fa-play"></i></button>
      <button id="nextBtn" class="ctl" aria-label="다음 곡"><i class="fa-solid fa-forward-step"></i></button>
      <button id="repeatBtn" class="ctl" aria-label="반복" data-mode="off" data-on="false"><i class="fa-solid fa-repeat"></i></button>
    </div>
    <div class="seek">
      <span id="tCur">0:00</span>
      <input id="seek" type="range" min="0" max="0" step="1" value="0" aria-label="재생 위치" disabled />
      <span id="tDur">--:--</span>
    </div>
  </div>

  <div class="bar-right">
    <button id="muteBtn" class="ctl" aria-label="음소거"><i class="fa-solid fa-volume-high"></i></button>
    <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-label="볼륨" />
  </div>
</div>

<!-- ============================== 입력 화면 (새 플레이리스트) ============================== -->
<section id="intake" class="modal">
  <div class="modal-card card">
    <button id="intakeClose" class="modal-close" aria-label="닫기" hidden><i class="fa-solid fa-xmark"></i></button>

    <div class="brand">
      <div class="logo"><i class="fa-solid fa-list-ol"></i></div>
      <b>트랙리스트</b>
    </div>

    <h1>타임테이블로 트랙을 나눠요</h1>
    <p class="lead">영상 설명란에 있는 타임테이블을 붙여넣으면 곡 단위로 끊어 들을 수 있는 재생목록을 만들어줘요.</p>

    <div class="field">
      <label class="label" for="videoId">영상 ID</label>
      <input id="videoId" class="field-input" placeholder="YouTube 영상 주소 또는 ID" autocomplete="off" />
      <p class="field-help">youtube.com/watch 또는 youtu.be 주소를 그대로 붙여넣어도 돼요.</p>
    </div>

    <div class="field">
      <label class="label" for="plName">플레이리스트 이름 (선택)</label>
      <input id="plName" class="field-input" placeholder="비워두면 영상 제목을 써요" autocomplete="off" />
    </div>

    <div class="field">
      <label class="label" for="timeline">타임테이블</label>
      <textarea id="timeline" class="field-input" placeholder="00:00 첫 번째 곡&#10;03:24 두 번째 곡&#10;07:10 세 번째 곡"></textarea>
    </div>

    <button id="generateBtn" class="submit">플레이리스트 추가</button>
    <p id="intakeFeedback" class="form-feedback" role="status" aria-live="polite" hidden></p>

    <p class="hint">한 줄에 시간 하나, 그 뒤에 곡 제목을 붙여넣으면 자동으로 시간순 정렬해요. 시:분:초 또는 분:초 형식 모두 인식해요.</p>
    <div class="copy"><b>Dutkyobot</b> &copy; 2026. All Rights Reserved.</div>
  </div>
</section>

<div id="ctx" class="ctx" hidden role="menu">
  <button id="ctxDelete" class="danger" role="menuitem"><i class="fa-regular fa-trash-can"></i> 삭제</button>
</div>

<script>
/*
  상태는 전부 App.state 안에 모아둔다.
  playlist : 원본 곡 데이터 (곡마다 videoId를 따로 갖고 있어서,
             나중에 여러 영상을 섞는 기능을 붙일 때 이 구조를 그대로 쓸 수 있다)
  order    : playlist의 인덱스를 재생 순서대로 나열한 배열.
             드래그 정렬 / 셔플은 이 배열만 바꾸고 playlist 자체는 건드리지 않는다.
  index    : order 안에서 현재 재생 중인 위치
  repeat   : 'off' | 'all' | 'one'
*/
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const App = {
  state:{
    playlists:[],        // 라이브러리에 저장된 플레이리스트들 {id, videoId, name, tracks, meta}
    activeId:null,
    playlist:[],
    order:[],
    index:0,
    shuffle:false,
    repeat:'off',
    name:'',
    isPlaying:false,
    finished:false,
    player:null,
    playerReady:false,
    pendingPlay:null,
    lastKnownTime:null,
    ignoreUntil:0,       // 우리가 직접 이동시킨 직후에는 '사용자 탐색' 감지를 잠깐 쉰다
    settleUntil:0,       // 새 곡 로딩 직후 재생바가 엉뚱한 값을 보이지 않게 0으로 고정
    seeking:false,
    videoTitle:'',
    videoAuthor:'',
    duration:0,
    search:'',
  },

  els:{
    app:$('app'), intake:$('intake'), intakeClose:$('intakeClose'),
    videoId:$('videoId'), plName:$('plName'), timeline:$('timeline'), generateBtn:$('generateBtn'),
    list:$('list'), main:$('main'),
    trackSearch:$('trackSearch'), searchClear:$('searchClear'), searchCount:$('searchCount'),
    intakeFeedback:$('intakeFeedback'), playerStatus:$('playerStatus'),
    plTitle:$('plTitle'), trackCount:$('trackCount'), plMeta:$('plMeta'), cover:$('cover'),
    libRail:$('libRail'), libStrip:$('libStrip'), ctx:$('ctx'), ctxDelete:$('ctxDelete'),
    nowTitle:$('nowTitle'), nowSub:$('nowSub'), nextList:$('nextList'),
    bar:$('bar'), barThumb:$('barThumb'), barTitle:$('barTitle'), barSub:$('barSub'),
    playBtn:$('playBtn'), prevBtn:$('prevBtn'), nextBtn:$('nextBtn'),
    repeatBtn:$('repeatBtn'), seek:$('seek'), tCur:$('tCur'), tDur:$('tDur'),
    muteBtn:$('muteBtn'), volume:$('volume'),
    railNew:$('railNew'),
  },

  init(){
    const e = this.els;
    e.generateBtn.addEventListener('click', () => this.generate());
    e.intakeClose.addEventListener('click', () => this.closeIntake());
    e.intake.addEventListener('mousedown', (ev) => { if(ev.target === e.intake) this.closeIntake(); });
    e.railNew.addEventListener('click', () => this.openIntake());

    e.playBtn.addEventListener('click', () => this.togglePlay());
    e.prevBtn.addEventListener('click', () => this.prev());
    e.nextBtn.addEventListener('click', () => this.next());
    e.repeatBtn.addEventListener('click', () => this.cycleRepeat());
    document.querySelectorAll('.js-shuffle').forEach((b) => b.addEventListener('click', () => this.toggleShuffle()));

    e.seek.addEventListener('input', () => { this.state.seeking = true; this.paintSeek(Number(e.seek.value), Number(e.seek.max)); });
    e.seek.addEventListener('change', () => this.seekWithinTrack(Number(e.seek.value)));
    e.volume.addEventListener('input', () => this.setVolume(Number(e.volume.value)));
    e.muteBtn.addEventListener('click', () => this.toggleMute());

    e.list.addEventListener('click', (ev) => this.onListClick(ev));
    e.list.addEventListener('dragstart', (ev) => this.onDragStart(ev));
    e.list.addEventListener('dragover', (ev) => this.onDragOver(ev));
    e.list.addEventListener('drop', (ev) => this.onDrop(ev));
    e.list.addEventListener('dragend', (ev) => this.onDragEnd(ev));

    e.trackSearch.addEventListener('input', () => {
      this.state.search = e.trackSearch.value.trim();
      e.searchClear.hidden = !e.trackSearch.value;
      this.render();
    });
    e.searchClear.addEventListener('click', () => {
      e.trackSearch.value = '';
      this.state.search = '';
      e.searchClear.hidden = true;
      this.render();
      e.trackSearch.focus();
    });
    [e.videoId, e.plName, e.timeline].forEach((field) => {
      field.addEventListener('input', () => {
        if(!e.intakeFeedback.hidden) this.showIntakeFeedback('');
      });
    });

    e.nextList.addEventListener('click', (ev) => {
      const b = ev.target.closest('[data-pos]');
      if(b) this.play(Number(b.dataset.pos));
    });

    document.addEventListener('keydown', (ev) => this.onKey(ev));

    // 라이브러리: 클릭=전환 / 우클릭=삭제 메뉴
    [e.libRail, e.libStrip].forEach((box) => {
      box.addEventListener('click', (ev) => {
        if(ev.target.closest('[data-add]')){ this.openIntake(); return; }
        const remove = ev.target.closest('[data-remove]');
        if(remove){
          const pl = this.state.playlists.find((p) => p.id === remove.dataset.remove);
          if(pl && window.confirm('"' + this.plName(pl) + '" 플레이리스트를 삭제할까요?')) this.deletePlaylist(pl.id);
          return;
        }
        const b = ev.target.closest('[data-id]');
        if(b && b.dataset.id !== this.state.activeId) this.selectPlaylist(b.dataset.id);
      });
      box.addEventListener('contextmenu', (ev) => {
        const b = ev.target.closest('[data-id]');
        if(!b) return;
        ev.preventDefault();
        this.showCtx(ev.clientX, ev.clientY, b.dataset.id);
      });
    });
    e.ctxDelete.addEventListener('click', () => {
      const id = this.ctxId;
      this.hideCtx();
      if(id) this.deletePlaylist(id);
    });
    document.addEventListener('pointerdown', (ev) => { if(!e.ctx.hidden && !e.ctx.contains(ev.target)) this.hideCtx(); });
    window.addEventListener('blur', () => this.hideCtx());
    window.addEventListener('resize', () => this.hideCtx());
    document.addEventListener('scroll', () => this.hideCtx(), true);

    // 유튜브 임베드 안의 재생바를 사용자가 직접 움직여도(=구간 이동)
    // 그 시각에 맞는 트랙을 계속 따라가도록 주기적으로 확인한다.
    setInterval(() => this.tick(), 250);
  },

  /* ---------- 유틸 ---------- */

  fmt(sec){
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const ss = String(s).padStart(2, '0');
    return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`;
  },

  fmtLong(sec){
    sec = Math.max(0, Math.floor(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    if(h > 0) return `${h}시간 ${m}분`;
    return `${m}분 ${s}초`;
  },

  // 곡 길이 = 다음 곡 시작 시각까지. 마지막 곡은 영상 전체 길이를 알아야 계산된다.
  trackDuration(playlistIndex){
    const { playlist, duration } = this.state;
    const t = playlist[playlistIndex];
    const next = playlist[playlistIndex + 1];
    if(next) return next.time - t.time;
    return duration > 0 ? Math.max(0, duration - t.time) : null;
  },

  /* ---------- 입력 검증 및 타임테이블 파싱 ---------- */

  normalizeVideoId(value){
    const raw = String(value || '').trim();
    if(!raw) return null;
    let id = raw;
    if(/youtube\.com|youtu\.be/i.test(raw)){
      try{
        const url = new URL(/^https?:\/\//i.test(raw) ? raw : 'https://' + raw);
        const host = url.hostname.replace(/^www\./, '');
        if(host === 'youtu.be'){
          id = url.pathname.split('/').filter(Boolean)[0] || '';
        }else if(host.endsWith('youtube.com') || host.endsWith('youtube-nocookie.com')){
          id = url.searchParams.get('v') || ((url.pathname.match(/^\/(?:embed|shorts|live)\/([^/]+)/) || [])[1] || '');
        }else return null;
      }catch(err){ return null; }
    }
    return /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
  },

  showIntakeFeedback(message, kind = 'error'){
    const el = this.els.intakeFeedback;
    el.textContent = message;
    el.dataset.kind = kind;
    el.hidden = !message;
  },

  parseTimeToSeconds(value){
    const parts = value.split(':').map(Number);
    if(parts.length === 2){
      if(parts[1] >= 60) return null;
      return parts[0] * 60 + parts[1];
    }
    if(parts.length === 3){
      if(parts[1] >= 60 || parts[2] >= 60) return null;
      return parts[0] * 3600 + parts[1] * 60 + parts[2];
    }
    return null;
  },

  parseTimeline(rawText, videoId){
    const tracks = [];
    for(const line of rawText.split('\n')){
      const match = line.trim().match(/^(?:[-*•]\s*)?(?:\d+\.\s*)?((?:\d{1,2}:)?\d{1,3}:[0-5]\d)\s*(?:[-–—]\s*)?(.*)$/);
      if(!match) continue;
      const time = this.parseTimeToSeconds(match[1]);
      if(time === null) continue;
      tracks.push({ time, title:match[2].trim() || '제목 없음', videoId });
    }
    return tracks.sort((a, b) => a.time - b.time);
  },

  /* ---------- 입력창 ---------- */

  openIntake(){
    this.els.intake.hidden = false;
    this.els.intakeClose.hidden = this.state.playlist.length === 0;
    this.els.videoId.focus();
  },

  closeIntake(){
    if(this.state.playlist.length === 0) return;
    this.els.intake.hidden = true;
  },

  generate(){
    const videoId = this.normalizeVideoId(this.els.videoId.value);
    const rawText = this.els.timeline.value;
    if(!videoId){
      this.showIntakeFeedback('유효한 YouTube 영상 주소 또는 11자리 영상 ID를 입력해 주세요.');
      this.els.videoId.focus();
      return;
    }
    if(!rawText.trim()){
      this.showIntakeFeedback('영상 설명란의 타임테이블을 입력해 주세요.');
      this.els.timeline.focus();
      return;
    }
    const tracks = this.parseTimeline(rawText, videoId);
    if(tracks.length === 0){
      this.showIntakeFeedback('시간과 곡 제목이 포함된 줄을 찾지 못했어요. 예시 형식으로 입력해 주세요.');
      this.els.timeline.focus();
      return;
    }
    if(tracks.some((track, i) => i > 0 && track.time === tracks[i - 1].time)){
      this.showIntakeFeedback('같은 시작 시간이 두 번 이상 있어요. 타임스탬프를 확인해 주세요.');
      this.els.timeline.focus();
      return;
    }
    const pl = {
      id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      videoId,
      name: this.els.plName.value.trim(),
      tracks,
      meta: null,
    };
    this.state.playlists.push(pl);
    this.els.videoId.value = '';
    this.els.plName.value = '';
    this.els.timeline.value = '';
    this.showIntakeFeedback('');
    this.selectPlaylist(pl.id);
  },

  /* ---------- 라이브러리 (여러 플레이리스트 + 저장) ---------- */

  STORAGE_KEY:'tracklist.library.v1',

  load(){
    try{
      const raw = localStorage.getItem(this.STORAGE_KEY);
      if(!raw) return;
      const d = JSON.parse(raw);
      const ok = (p) => p && p.id && p.videoId && Array.isArray(p.tracks) && p.tracks.length > 0;
      if(Array.isArray(d.list)) this.state.playlists = d.list.filter(ok);
      this.state.activeId = d.active || null;
    }catch(err){ /* 저장소를 못 쓰는 환경이면 이번 방문 동안만 유지된다 */ }
  },

  save(){
    try{
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify({ list:this.state.playlists, active:this.state.activeId }));
    }catch(err){ /* 무시 */ }
  },

  boot(){
    this.load();
    const s = this.state;
    if(s.playlists.length === 0){ this.openIntake(); return; }
    const id = s.playlists.some((p) => p.id === s.activeId) ? s.activeId : s.playlists[0].id;
    this.selectPlaylist(id, { autoplay:false }); // 방문 직후엔 자동재생이 막히므로 곡만 준비해 둔다
  },

  plName(p){
    return p.name || (p.meta && p.meta.title) || p.videoId;
  },

  // 저장된 순서(위아래/드래그로 바꾼 것)가 올바르면 그것을, 아니면 원래 순서를 쓴다.
  // 곡 배열(pl.tracks)은 시간순이어야 곡 길이·끝 판정이 맞아서, 순서는 따로 저장한다.
  baseOrder(pl){
    const n = pl.tracks.length;
    const o = pl.order;
    if(Array.isArray(o) && o.length === n && o.every((x) => Number.isInteger(x) && x >= 0 && x < n) && new Set(o).size === n) return o.slice();
    return pl.tracks.map((_, i) => i);
  },

  // 직접 바꾼 순서를 저장한다. 셔플은 임시 상태라 셔플 중에는 저장하지 않는다.
  persistOrder(){
    const s = this.state;
    if(s.shuffle) return;
    const pl = s.playlists.find((p) => p.id === s.activeId);
    if(!pl) return;
    pl.order = s.order.slice();
    this.save();
  },

  selectPlaylist(id, opts = {}){
    const s = this.state;
    const pl = s.playlists.find((p) => p.id === id);
    if(!pl) return;

    s.activeId = id;
    s.playlist = pl.tracks;
    s.order = this.baseOrder(pl);
    s.index = 0;
    s.shuffle = false;
    s.name = pl.name;
    s.videoTitle = (pl.meta && pl.meta.title) || '';
    s.videoAuthor = (pl.meta && pl.meta.author) || '';
    s.duration = (pl.meta && pl.meta.duration) || 0;
    s.finished = false;
    s.search = '';
    this.els.trackSearch.value = '';
    this.els.searchClear.hidden = true;

    this.els.intake.hidden = true;
    this.els.app.hidden = false;
    this.els.bar.hidden = false;

    const thumb = `https://i.ytimg.com/vi/${encodeURIComponent(pl.videoId)}/mqdefault.jpg`;
    [this.els.cover, this.els.barThumb].forEach((box) => {
      box.innerHTML = `<img src="${thumb}" alt="" onerror="this.remove()">`;
    });

    this.renderLibrary();
    this.save();
    this.play(0, { autoplay: opts.autoplay !== false });
  },

  renderLibrary(){
    const s = this.state;
    const item = (p) => {
      const name = this.plName(p);
      return '<div class="lib-entry">' +
        '<button class="lib-item' + (p.id === s.activeId ? ' active' : '') + '" data-id="' + esc(p.id) + '" title="' + esc(name) + '" aria-label="' + esc(name) + '">' +
          '<span class="lib-in"><span class="lib-ph">' + esc([...name][0] || '♪') + '</span><img src="https://i.ytimg.com/vi/' + encodeURIComponent(p.videoId) + '/mqdefault.jpg" alt="" onerror="this.remove()"></span>' +
        '</button>' +
        '<button class="lib-remove" type="button" data-remove="' + esc(p.id) + '" aria-label="' + esc(name) + ' 삭제" title="플레이리스트 삭제"><i class="fa-solid fa-xmark"></i></button>' +
      '</div>';
    };
    const items = s.playlists.map(item).join('');
    this.els.libRail.innerHTML = items;
    this.els.libStrip.innerHTML = '<button class="lib-add" data-add aria-label="플레이리스트 추가"><i class="fa-solid fa-plus"></i></button>' + items;
  },

  showCtx(x, y, id){
    this.ctxId = id;
    const m = this.els.ctx;
    m.hidden = false;
    const w = m.offsetWidth, h = m.offsetHeight;
    m.style.left = Math.min(x, window.innerWidth - w - 8) + 'px';
    m.style.top = Math.min(y, window.innerHeight - h - 8) + 'px';
  },

  hideCtx(){
    this.els.ctx.hidden = true;
    this.ctxId = null;
  },

  deletePlaylist(id){
    const s = this.state;
    const i = s.playlists.findIndex((p) => p.id === id);
    if(i === -1) return;
    const wasActive = s.activeId === id;
    s.playlists.splice(i, 1);

    if(!wasActive){ this.renderLibrary(); this.save(); return; }

    if(s.playlists.length > 0){
      this.selectPlaylist(s.playlists[Math.min(i, s.playlists.length - 1)].id);
      return;
    }

    // 마지막 하나까지 지웠으면 재생을 멈추고 처음 화면으로
    s.activeId = null;
    s.playlist = []; s.order = []; s.index = 0;
    s.isPlaying = false; s.finished = false;
    try{ s.player.stopVideo(); }catch(err){ /* 플레이어 준비 전이면 무시 */ }
    document.body.classList.add('is-paused');
    this.save();
    this.renderLibrary();
    this.els.app.hidden = true;
    this.els.bar.hidden = true;
    this.openIntake();
  },

  /* ---------- 렌더 ---------- */

  render(){
    const { playlist, order, index, search } = this.state;
    const query = (search || '').toLocaleLowerCase('ko');
    const visible = order.map((pi, position) => ({ pi, position, track:playlist[pi] }))
      .filter((item) => !query || item.track.title.toLocaleLowerCase('ko').includes(query));

    this.els.trackCount.textContent = playlist.length + '곡';
    this.els.searchCount.textContent = query ? (visible.length + ' / ' + playlist.length + '곡 표시') : '';
    if(visible.length === 0){
      this.els.list.innerHTML = '<div class="list-empty">검색 결과가 없어요.<span>다른 곡 제목으로 검색해 보세요.</span></div>';
      this.renderNext();
      return;
    }

    this.els.list.innerHTML = visible.map(({ pi, position, track }) => {
      const active = position === index;
      const d = this.trackDuration(pi);
      const eq = '<span class="eq" aria-hidden="true"><span></span><span></span><span></span></span>';
      const hoverIcon = '<span class="hov" aria-hidden="true"><i class="fa-solid fa-play"></i></span>';
      return '<div class="track-row' + (active ? ' active' : '') + '" draggable="' + (!query ? 'true' : 'false') + '" data-position="' + position + '" role="listitem">' +
        '<button class="track-play" type="button" data-action="play" aria-label="' + esc(track.title) + ' 재생" aria-current="' + (active ? 'true' : 'false') + '">' +
          '<span class="c-num"><span class="num">' + (position + 1) + '</span>' + (active ? eq : hoverIcon) + '</span>' +
          '<span class="c-title"><span class="t">' + esc(track.title) + '</span></span>' +
        '</button>' +
        '<div class="c-start">' + this.fmt(track.time) + '</div>' +
        '<div class="c-len">' + (d === null ? '--:--' : this.fmt(d)) + '</div>' +
        '<div class="c-act">' +
          '<button class="mini-btn" type="button" data-action="up" aria-label="' + (position + 1) + '번 곡 위로 이동" title="위로 이동"' + (position === 0 ? ' disabled' : '') + '><i class="fa-solid fa-chevron-up"></i></button>' +
          '<button class="mini-btn" type="button" data-action="down" aria-label="' + (position + 1) + '번 곡 아래로 이동" title="아래로 이동"' + (position === order.length - 1 ? ' disabled' : '') + '><i class="fa-solid fa-chevron-down"></i></button>' +
        '</div>' +
      '</div>';
    }).join('');

    this.renderNext();
  },

  renderNext(){
    const { playlist, order, index } = this.state;
    const upcoming = order.slice(index + 1, index + 6);
    if(upcoming.length === 0){
      this.els.nextList.innerHTML = '<div class="next-empty">마지막 곡이에요</div>';
      return;
    }
    this.els.nextList.innerHTML = upcoming.map((pi, i) => {
      const d = this.trackDuration(pi);
      return `<button class="next-item" data-pos="${index + 1 + i}">
        <span class="n">${index + 2 + i}</span>
        <span class="t">${esc(playlist[pi].title)}</span>
        <span class="d">${d === null ? '' : this.fmt(d)}</span>
      </button>`;
    }).join('');
  },

  // 헤더 / 패널 / 재생바의 글자와 버튼 상태를 현재 상태에 맞춘다
  updateUI(){
    const s = this.state;
    if(s.playlist.length === 0) return;

    const title = s.name || s.videoTitle || '트랙리스트';
    this.els.plTitle.textContent = title;

    const known = s.order.map((pi) => this.trackDuration(pi)).filter((d) => d !== null);
    const total = known.reduce((a, b) => a + b, 0);
    const parts = [];
    if(s.videoAuthor) parts.push(esc(s.videoAuthor));
    parts.push(`${s.playlist.length}곡${known.length ? ', ' + this.fmtLong(total) : ''}`);
    this.els.plMeta.innerHTML = parts.join(' · ');

    const pi = s.order[s.index];
    const track = s.playlist[pi];
    if(track){
      const d = this.trackDuration(pi);
      this.els.nowTitle.textContent = track.title;
      this.els.nowSub.textContent = `${s.index + 1} / ${s.order.length} · ${this.fmt(track.time)}${d === null ? '' : ' – ' + this.fmt(track.time + d)}`;
      this.els.barTitle.textContent = track.title;
      this.els.barSub.textContent = title;
    }

    const icon = s.isPlaying ? 'fa-pause' : 'fa-play';
    this.els.playBtn.innerHTML = `<i class="fa-solid ${icon}"></i>`;
    document.body.classList.toggle('is-paused', !s.isPlaying);

    document.querySelectorAll('.js-shuffle').forEach((b) => b.setAttribute('aria-pressed', String(s.shuffle)));

    const on = s.repeat !== 'off';
    this.els.repeatBtn.dataset.mode = s.repeat;
    this.els.repeatBtn.dataset.on = String(on);
    this.els.repeatBtn.setAttribute('aria-label', `반복: ${{off:'끔', all:'전체', one:'한 곡'}[s.repeat]}`);
  },

  /* ---------- 주기적 갱신 ---------- */

  tick(){
    this.syncToPlaybackTime();
    this.checkMeta();
    this.updateProgress();
  },

  // 유튜브가 영상 제목 / 길이를 알려주는 건 로딩이 끝난 뒤라서, 바뀌면 그때 다시 그린다
  checkMeta(){
    const s = this.state;
    const p = s.player;
    if(!s.playerReady || !p || s.playlist.length === 0) return;
    if(typeof p.getDuration !== 'function' || typeof p.getVideoData !== 'function') return;

    // 플레이리스트를 막 바꾼 직후엔 이전 영상의 정보가 남아 있을 수 있어서 같은 영상일 때만 받는다
    const data = p.getVideoData();
    if(!data || data.video_id !== s.playlist[0].videoId) return;

    let changed = false;
    const dur = p.getDuration() || 0;
    if(dur > 0 && dur !== s.duration){ s.duration = dur; changed = true; }
    if(data.title && data.title !== s.videoTitle){ s.videoTitle = data.title; changed = true; }
    if(data.author && data.author !== s.videoAuthor){ s.videoAuthor = data.author; changed = true; }

    if(changed){
      const pl = s.playlists.find((x) => x.id === s.activeId);
      if(pl){
        pl.meta = { title:s.videoTitle, author:s.videoAuthor, duration:s.duration };
        this.save();
        this.renderLibrary();
      }
      this.render();
      this.updateUI();
    }
  },

  paintSeek(value, max){
    this.els.seek.style.setProperty('--p', max > 0 ? `${(value / max) * 100}%` : '0%');
    this.els.tCur.textContent = this.fmt(value);
  },

  updateProgress(){
    const s = this.state;
    const p = s.player;
    if(!s.playerReady || !p || s.playlist.length === 0 || typeof p.getCurrentTime !== 'function') return;
    if(s.seeking) return;

    const pi = s.order[s.index];
    const track = s.playlist[pi];
    const d = this.trackDuration(pi);

    let elapsed = Date.now() < s.settleUntil ? 0 : Math.max(0, p.getCurrentTime() - track.time);
    if(d !== null) elapsed = Math.min(elapsed, d);

    const seek = this.els.seek;
    seek.disabled = d === null || d <= 0;
    seek.max = d === null ? 0 : Math.floor(d);
    seek.value = Math.floor(elapsed);
    this.paintSeek(Math.floor(elapsed), Number(seek.max));
    this.els.tDur.textContent = d === null ? '--:--' : this.fmt(d);
  },

  /* ---------- 재생 시각 ↔ 트랙 동기화 ----------
     한 영상 안에서 시간대로 곡을 나눈 것뿐이라 두 가지를 직접 감지해야 한다.
     1) 자연스러운 재생이 '지금 곡이 끝나는 시각'(= 시간순으로 바로 다음 곡의 시작)을 지나갔으면
        -> 재생 순서상 다음 곡으로 넘어간다. (셔플/순서 변경 상태에서도 올바르게 동작)
     2) 폴링 간격에 비해 시각이 갑자기 크게 뛰거나 되돌아갔으면(=사용자가 재생바를
        직접 움직인 것) -> 그 시각에 해당하는 트랙으로 표시가 따라간다.
  */

  findPlaylistIndexForTime(t){
    const { playlist } = this.state; // parseTimeline에서 이미 시간순 정렬됨
    let found = 0;
    for(let i = 0; i < playlist.length; i++){
      if(playlist[i].time <= t) found = i;
      else break;
    }
    return found;
  },

  syncToPlaybackTime(){
    const s = this.state;
    const { player, playlist, order, index } = s;
    if(playlist.length === 0 || !s.playerReady) return;
    if(!player || typeof player.getCurrentTime !== 'function') return;

    if(Date.now() < s.ignoreUntil){ s.lastKnownTime = null; return; }

    const currentTime = player.getCurrentTime();

    if(s.lastKnownTime === null){
      s.lastKnownTime = currentTime;
      return;
    }

    const delta = currentTime - s.lastKnownTime;
    s.lastKnownTime = currentTime;

    // 폴링 주기보다 훨씬 크게 튀거나 뒤로 되돌아갔으면 사용자가 직접 탐색한 것
    if(delta < -0.75 || delta > 1.5){
      const pos = order.indexOf(this.findPlaylistIndexForTime(currentTime));
      if(pos !== -1 && pos !== index) this.setCurrent(pos);
      return;
    }

    const pi = order[index];
    const nextInTime = playlist[pi + 1];
    if(nextInTime && currentTime >= nextInTime.time && s.isPlaying){
      this.advance(true);
    }
    // 시간순 마지막 곡은 영상 종료 이벤트(onStateChange)에서 처리
  },

  /* ---------- 재생 제어 ---------- */

  // 인덱스와 화면만 바꾸고 영상은 건드리지 않는다
  setCurrent(position){
    this.state.index = position;
    this.render();
    this.updateUI();
  },

  play(position, opts = {}){
    const autoplay = opts.autoplay !== false;
    const s = this.state;
    const track = s.playlist[s.order[position]];
    if(!track) return;

    s.finished = false;
    s.lastKnownTime = null;
    s.ignoreUntil = Date.now() + 1500;
    s.settleUntil = Date.now() + 700;
    if(!autoplay) s.isPlaying = false;
    this.setCurrent(position);

    if(!s.playerReady || !s.player || typeof s.player.loadVideoById !== 'function'){
      s.pendingPlay = { position, autoplay };
      return;
    }

    try{
      const data = typeof s.player.getVideoData === 'function' ? s.player.getVideoData() : null;
      if(data && data.video_id === track.videoId){
        s.player.seekTo(track.time, true);
        if(autoplay) s.player.playVideo();
        else s.player.pauseVideo();
      }else if(autoplay){
        s.player.loadVideoById({ videoId: track.videoId, startSeconds: track.time });
      }else{
        s.player.cueVideoById({ videoId: track.videoId, startSeconds: track.time });
      }
    }catch(err){
      console.error(err);
    }
  },

  togglePlay(){
    const s = this.state;
    if(s.playlist.length === 0 || !s.playerReady) return;
    if(s.finished){ this.play(0); return; }
    if(s.isPlaying) s.player.pauseVideo();
    else s.player.playVideo();
  },

  // 곡이 끝났을 때(auto=true) 반복 설정을 따라 다음으로 간다. 수동 이동은 항상 순환한다.
  advance(auto){
    const s = this.state;
    const { order, index, playlist } = s;
    if(order.length === 0) return;

    if(auto && s.repeat === 'one'){ this.play(index); return; }

    let next = index + 1;
    if(next >= order.length){
      if(auto && s.repeat === 'off'){ this.finish(); return; }
      next = 0;
    }

    // 재생 순서상 다음 곡이 시간순으로도 바로 다음 곡이면 영상은 이미 거기를 지나는 중이라
    // 다시 이동(=끊김) 없이 표시만 넘긴다.
    const contiguous = auto && next === index + 1 && order[next] === order[index] + 1 && playlist[order[next]];
    if(contiguous) this.setCurrent(next);
    else this.play(next);
  },

  finish(){
    const s = this.state;
    s.finished = true;
    try{ s.player.pauseVideo(); }catch(err){ console.error(err); }
    s.isPlaying = false;
    this.updateUI();
  },

  next(){ if(this.state.order.length) this.advance(false); },

  prev(){
    const { order, index } = this.state;
    if(order.length === 0) return;
    this.play((index - 1 + order.length) % order.length);
  },

  cycleRepeat(){
    const s = this.state;
    s.repeat = { off:'all', all:'one', one:'off' }[s.repeat];
    this.updateUI();
  },

  toggleShuffle(){
    const s = this.state;
    if(s.playlist.length === 0) return;
    s.shuffle = !s.shuffle;

    // 지금 재생 중인 곡은 그대로 맨 앞에 두고 나머지만 섞는다
    const currentPi = s.order[s.index];
    if(s.shuffle){
      const rest = s.order.filter((pi) => pi !== currentPi).sort(() => Math.random() - 0.5);
      s.order = [currentPi, ...rest];
      s.index = 0;
    }else{
      const pl = s.playlists.find((p) => p.id === s.activeId);
      s.order = pl ? this.baseOrder(pl) : s.playlist.map((_, i) => i);
      s.index = Math.max(0, s.order.indexOf(currentPi));
    }

    this.render();
    this.updateUI();
  },

  seekWithinTrack(offset){
    const s = this.state;
    s.seeking = false;
    if(!s.playerReady || s.playlist.length === 0) return;
    const track = s.playlist[s.order[s.index]];
    s.lastKnownTime = null;
    s.ignoreUntil = Date.now() + 800;
    try{ s.player.seekTo(track.time + offset, true); }catch(err){ console.error(err); }
  },

  /* ---------- 볼륨 ---------- */

  setVolume(v){
    const p = this.state.player;
    if(!this.state.playerReady || !p) return;
    try{
      p.setVolume(v);
      if(v > 0 && p.isMuted && p.isMuted()) p.unMute();
    }catch(err){ console.error(err); }
    this.paintVolume(v);
  },

  paintVolume(v){
    this.els.volume.style.setProperty('--p', `${v}%`);
    const icon = v === 0 ? 'fa-volume-xmark' : v < 50 ? 'fa-volume-low' : 'fa-volume-high';
    this.els.muteBtn.innerHTML = `<i class="fa-solid ${icon}"></i>`;
  },

  toggleMute(){
    const p = this.state.player;
    if(!this.state.playerReady || !p) return;
    try{
      if(p.isMuted()){ p.unMute(); this.paintVolume(Number(this.els.volume.value)); }
      else{ p.mute(); this.paintVolume(0); }
    }catch(err){ console.error(err); }
  },

  /* ---------- 키보드 ---------- */

  onKey(ev){
    if(!this.els.ctx.hidden){
      if(ev.key === 'Escape') this.hideCtx();
      return;
    }
    if(!this.els.intake.hidden){
      if(ev.key === 'Escape') this.closeIntake();
      return;
    }
    if(this.state.playlist.length === 0) return;
    const tag = (ev.target.tagName || '').toLowerCase();
    if(ev.key === 'Escape' && this.state.search){
      this.els.trackSearch.value = '';
      this.state.search = '';
      this.els.searchClear.hidden = true;
      this.render();
      return;
    }
    if(tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if(ev.key === '/' && tag !== 'button'){
      ev.preventDefault();
      this.els.trackSearch.focus();
      return;
    }
    if(ev.target.closest && ev.target.closest('button, a, [role="button"]')) return;
    if(ev.code === 'Space'){ ev.preventDefault(); this.togglePlay(); }
    else if(ev.key === 'ArrowRight'){ ev.preventDefault(); this.next(); }
    else if(ev.key === 'ArrowLeft'){ ev.preventDefault(); this.prev(); }
  },

  /* ---------- 목록 클릭 위임 (재생 / 순서 이동) ---------- */

  onListClick(e){
    const row = e.target.closest('.track-row');
    if(!row) return;

    const position = Number(row.dataset.position);
    const btn = e.target.closest('[data-action]');
    if(!btn) return;
    const action = btn.dataset.action;

    if(action === 'up') this.moveTrack(position, position - 1);
    else if(action === 'down') this.moveTrack(position, position + 1);
    else if(action === 'play' && position === this.state.index && !this.state.finished) this.togglePlay();
    else if(action === 'play') this.play(position);
  },

  moveTrack(from, to){
    const { order } = this.state;
    if(to < 0 || to >= order.length) return;

    [order[from], order[to]] = [order[to], order[from]];
    this.reindexAfterMove(from, to);
    this.persistOrder();
    this.render();
    this.updateUI();
  },

  reindexAfterMove(from, to){
    const { index } = this.state;
    if(index === from) this.state.index = to;
    else if(index === to) this.state.index = from;
  },

  /* ---------- 드래그 정렬 ---------- */

  onDragStart(e){
    const row = e.target.closest('.track-row');
    if(!row) return;
    row.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', row.dataset.position);
  },

  onDragOver(e){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  },

  onDrop(e){
    e.preventDefault();
    const row = e.target.closest('.track-row');
    if(!row) return;

    const from = Number(e.dataTransfer.getData('text/plain'));
    const to = Number(row.dataset.position);
    if(from === to) return;

    const { order } = this.state;
    const [moved] = order.splice(from, 1);
    order.splice(to, 0, moved);

    const { index } = this.state;
    if(index === from) this.state.index = to;
    else if(from < index && to >= index) this.state.index--;
    else if(from > index && to <= index) this.state.index++;

    this.persistOrder();
    this.render();
    this.updateUI();
  },

  onDragEnd(e){
    const row = e.target.closest('.track-row');
    if(row) row.classList.remove('dragging');
  },
};

App.init();
App.boot();

// 플레이어가 일정 시간 안에 준비되지 않으면 조용히 멈춰 있지 말고 안내한다
setTimeout(() => {
  if(App.state.playerReady) return;
  App.els.playerStatus.textContent = '플레이어를 불러오지 못했어요. 네트워크 상태를 확인하고 페이지를 새로고침해 주세요.';
  App.els.playerStatus.hidden = false;
}, 10000);

function onYouTubeIframeAPIReady(){
  App.state.player = new YT.Player('player', {
    host:'https://www.youtube-nocookie.com',
    width:'100%',
    height:'100%',
    videoId:'',
    playerVars:{
      autoplay:1,
      controls:1,
      rel:0,
      modestbranding:1,
      origin:location.origin,
      playsinline:1,
      iv_load_policy:3,
      widget_referrer:location.href,
    },
    events:{
      onReady:() => {
        const s = App.state;
        s.playerReady = true;
        App.els.playerStatus.hidden = true;
        try{
          const v = s.player.getVolume();
          App.els.volume.value = v;
          App.paintVolume(s.player.isMuted() ? 0 : v);
        }catch(err){ App.paintVolume(100); }
        if(s.pendingPlay !== null){
          App.play(s.pendingPlay.position, { autoplay: s.pendingPlay.autoplay });
          s.pendingPlay = null;
        }
      },
      onStateChange:(e) => {
        const s = App.state;
        if(e.data === 1){
          s.isPlaying = true;
          App.els.playerStatus.hidden = true;
        }else if(e.data === 2) s.isPlaying = false;
        else if(e.data === 0){
          s.isPlaying = false;
          App.advance(true);
        }
        App.updateUI();
      },
      onError:(e) => {
        console.error('YT Error:', e.data);
        const messages = {
          2:'영상 ID가 올바르지 않거나 요청 형식이 잘못됐어요.',
          5:'YouTube 플레이어에서 재생 오류가 발생했어요.',
          100:'영상이 삭제됐거나 비공개 상태예요.',
          101:'이 영상은 외부 사이트에서 재생할 수 없어요.',
          150:'이 영상은 외부 사이트에서 재생할 수 없어요.',
          153:'YouTube가 재생 요청의 출처 정보를 확인하지 못했어요. 페이지를 새로고침해 보세요.'
        };
        App.els.playerStatus.textContent = messages[e.data] || '영상을 재생할 수 없어요. 영상 공개 상태를 확인해 주세요.';
        App.els.playerStatus.hidden = false;
      },
    },
  });
}
