<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AI 작곡기</title>
<script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
<style>
:root{color-scheme:dark;--bg:#0e0e11;--p1:#1a1a1f;--p2:#222228;--p3:#2c2c34;--bd:#32323b;--fg:#e8e8ee;--mut:#8d8d9b;--ac:#19d3c5;--acf:#04201e;--err:#ff3b5c}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
.app{display:grid;grid-template-rows:52px minmax(0,1fr);height:100dvh}
.top{display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--p1);border-bottom:1px solid var(--bd);overflow-x:auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;white-space:nowrap;margin-right:14px}
.logo b{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,var(--ac),#4f8cff);display:grid;place-items:center;color:var(--acf);font-size:13px}
.tp{display:flex;align-items:center;gap:12px;white-space:nowrap}.tp b{font:600 13px/1 ui-monospace,Menlo,monospace;min-width:84px}
.sp{flex:1}
button{min-height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--bd);background:var(--p3);color:var(--fg);font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
button:hover:not(:disabled){border-color:var(--ac)}
button.main,button.on{background:var(--ac);border-color:var(--ac);color:var(--acf)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
textarea,input,select{padding:9px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:inherit;font:inherit}
textarea,input:not([type=range]):not([type=checkbox]){width:100%}textarea{min-height:120px;resize:vertical}
input[type=range]{accent-color:var(--ac);padding:0}input[type=checkbox]{accent-color:var(--ac)}
label{display:flex;align-items:center;gap:6px;font-size:13px}small{color:var(--mut)}
.main{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:0}
.panel{display:flex;flex-direction:column;min-height:0;overflow:auto;background:var(--p1);border-right:1px solid var(--bd)}
.panel.r{border-right:0;border-left:1px solid var(--bd)}
.ph{flex:none;padding:10px 14px;font-size:12px;font-weight:700;color:var(--mut);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);background:var(--p2)}
.ph:first-child{border-top:0}
.pane{padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
details{margin:12px 0}summary{cursor:pointer;color:var(--mut);font-size:13px}
#ex{margin:8px 0}#ex button{min-height:0;padding:3px 12px;border-radius:999px;font-size:12px}
#out{grid-column:2;display:grid;grid-template-columns:minmax(0,1fr) 288px;min-height:0}#out[hidden]{display:none}
.empty{grid-column:2;display:grid;place-items:center;padding:24px;text-align:center;color:var(--mut);background:repeating-conic-gradient(#15151a 0 25%,#101014 0 50%) 0 0/20px 20px}
#out:not([hidden])+.empty{display:none}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:auto;padding:16px 18px}
.stage h2{font-size:18px;margin:0}.info{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
canvas{width:100%;height:240px;display:block;margin:12px 0;border:1px solid var(--bd);border-radius:8px;cursor:pointer;background:repeating-conic-gradient(#15151a 0 25%,#101014 0 50%) 0 0/20px 20px}
.c{display:inline-block;border:1px solid var(--bd);background:var(--p2);border-radius:6px;padding:1px 9px;margin:0 6px 6px 0;font-size:12px}
.mr{display:flex;align-items:center;gap:8px;margin:6px 0}.mr span{flex:0 0 96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}.mr input[type=range]{flex:1;min-width:0}
.mr button{min-height:30px;padding:0 10px}.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
#lib .mr span{flex:1}
#st{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(92vw,560px);background:var(--p3);border:1px solid var(--bd);color:var(--fg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:9;box-shadow:0 4px 16px rgba(0,0,0,.4)}
#st:empty{display:none}#st.err{background:var(--err);border-color:var(--err);color:#fff}
#st.busy::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#st.busy::before{animation:none}}
@media(max-width:900px){
html,body{height:auto}.app{display:block;height:auto}
.top{flex-wrap:wrap;height:auto;padding:8px 14px;overflow:visible}.sp{display:none}
.main{display:block}.panel,.panel.r{overflow:visible;border:0}
#out{display:block}.empty{display:none}
.stage{overflow:visible}.g2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="logo"><b>♪</b>AI 작곡기</div>
<div class="tp"><button id="play" class="main" disabled>▶ 재생</button><b id="pos">1 / 1 마디</b><label><input type="checkbox" id="lp"> 반복</label></div>
<span class="sp"></span>
<button id="imp">JSON 불러오기</button><input id="f" type="file" accept=".json" hidden>
<button id="sv" disabled>보관함에 저장</button><button id="save" disabled>JSON 저장</button><button id="mp3" disabled>MP3 저장</button>
</header>
<div class="main">
<aside class="panel">
<div class="ph">곡 만들기</div>
<div class="pane">
<textarea id="p" placeholder="예: 비 오는 밤 재즈 카페 느낌, 느린 스윙, 피아노·콘트라베이스·브러시 드럼, 16마디"></textarea>
<div id="ex" class="row"><small>예시</small>
<button data-t="비 오는 밤 재즈 카페 느낌, 느린 스윙, 피아노·콘트라베이스·브러시 드럼, 16마디">재즈 카페</button>
<button data-t="신나는 8비트 게임 배경음악, 빠른 템포, 밝은 장조, 16마디">8비트 게임 BGM</button>
<button data-t="따뜻한 저녁 분위기의 잔잔한 어쿠스틱 기타 발라드, 느린 템포, 16마디">어쿠스틱 발라드</button></div>
<details><summary>고급 옵션</summary>
<div class="g2"><input id="og" placeholder="장르 (예: 로파이 힙합)"><input id="ok" placeholder="키 (예: C, F#m)"><input id="ob" type="number" placeholder="BPM (50~200)"><input id="om" type="number" placeholder="마디 수 (4~32)"></div>
<input id="oi" style="margin-top:8px" placeholder="악기 (예: 피아노, 콘트라베이스, 브러시 드럼)">
</details>
<details id="ks"><summary>API 키 설정</summary>
<div class="row"><input id="k" type="password" placeholder="Google AI Studio API 키" autocomplete="off"></div>
<small>aistudio.google.com에서 발급 · 이 브라우저에만 저장</small>
</details>
<button id="gen" class="main" style="width:100%">작곡하기</button>
</div>
<div class="ph">보관함</div>
<div class="pane"><div id="lib"></div></div>
</aside>
<div id="out" hidden>
<section class="stage">
<div class="info"><h2 id="ti"></h2><small id="meta"></small></div>
<canvas id="roll" aria-label="피아노롤: 클릭하면 그 위치부터 재생"></canvas>
<div id="ch"></div>
</section>
<aside class="panel r">
<div class="ph">재생 설정</div>
<div class="pane">
<div class="mr"><span>템포 <b id="bv"></b></span><input id="bs" aria-label="템포" type="range" min="50" max="200"></div>
<div class="mr"><span>키 (반음) <b id="tv">0</b></span><input id="ts" aria-label="키 이동(반음)" type="range" min="-12" max="12" value="0"></div>
<div class="mr"><span>리버브</span><input id="rs" aria-label="리버브" type="range" min="0" max="1" step=".01" value=".25"></div>
</div>
<div class="ph">믹서</div>
<div class="pane"><div id="mx"></div></div>
<div class="ph">곡 수정</div>
<div class="pane">
<input id="ei" placeholder="예: 드럼을 더 단순하게 / 멜로디를 더 서정적으로">
<div class="row"><label>악기 <select id="et"></select></label></div>
<div class="row"><label>마디 <input id="e0" class="n" type="number" min="1" placeholder="처음" style="width:72px"> ~ <input id="e1" class="n" type="number" min="1" placeholder="끝" style="width:72px"></label></div>
<button id="eb" class="main" style="width:100%">수정하기</button>
</div>
</aside>
</div>
<div class="empty"><div><b>아직 곡이 없어요</b><br><small>왼쪽에서 곡을 설명하고 작곡하거나, 위에서 JSON을 불러오세요</small></div></div>
</div>
</div>
<div id="st" role="status" aria-live="polite"></div>
<script>
const $ = (i) => document.getElementById(i);
const MODEL = 'gemini-3.5-flash'; // 한도/오류가 나면 다른 Gemini 모델 ID로 바꾸세요
const BASE = 'https://surikov.github.io/webaudiofontdata/sound/';
const DRUMS = { kick: 36, rim: 37, snare: 38, clap: 39, hat: 42, open_hat: 46, tom: 45, crash: 49 };
const SEMI = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

const SCHEMA = {
  type: 'object',
  required: ['title', 'bpm', 'key', 'scale', 'beatsPerBar', 'totalBars', 'instruments', 'chordProgression', 'tracks'],
  properties: {
    title: { type: 'string' }, bpm: { type: 'integer' }, key: { type: 'string' }, scale: { type: 'string' },
    beatsPerBar: { type: 'integer' }, totalBars: { type: 'integer' },
    instruments: { type: 'array', items: { type: 'object', required: ['id', 'label', 'role'], properties: {
      id: { type: 'string' }, label: { type: 'string' },
      program: { type: 'integer', description: 'General MIDI 프로그램 번호 0-127 (드럼이면 생략)' },
      drums: { type: 'boolean', description: '드럼 킷이면 true' },
      role: { type: 'string', enum: ['melody', 'harmony', 'bass', 'rhythm', 'pad'] },
      volume: { type: 'number' } } } },
    chordProgression: { type: 'array', items: { type: 'object', required: ['bar', 'chord'], properties: {
      bar: { type: 'integer', description: '1부터' }, chord: { type: 'string' } } } },
    tracks: { type: 'array', items: { type: 'object', required: ['instrumentId', 'notes'], properties: {
      instrumentId: { type: 'string' },
      notes: { type: 'array', items: { type: 'object', required: ['pitch', 'start', 'duration'], properties: {
        pitch: { type: 'string', description: '음 이름(C4, Bb2) 또는 드럼: ' + Object.keys(DRUMS).join('/') },
        start: { type: 'number', description: '곡 처음부터 박 단위(0부터)' },
        duration: { type: 'number', description: '박 단위' },
        velocity: { type: 'number', description: '0~1' } } } } } } }
  }
};

const SYSTEM = `당신은 작곡가이자 편곡가입니다. 소리를 직접 내지 않고, 지정된 JSON 스키마에 맞는 악보 데이터만 출력하세요.
- 시간 단위는 박(4분음표=1), start는 곡 처음 기준 절대 위치. 노트는 totalBars*beatsPerBar 박을 넘지 않게.
- 지정한 key/scale 안에서 작곡하고, 코드 진행과 harmony/bass 노트가 일치해야 함. 베이스는 코드 근음 중심.
- 멜로디는 2~4마디 모티프를 반복·변주하고 마지막은 해결감 있게.
- 악기는 3~6개. program은 General MIDI 번호(예: 0 피아노, 4 일렉피아노, 24 나일론기타, 32 어쿠스틱베이스, 33 핑거베이스, 48 스트링, 56 트럼펫, 65 알토색소폰, 73 플루트). 드럼은 drums:true, pitch는 ${Object.keys(DRUMS).join(', ')} 만 사용.
- velocity로 강약을 표현하고 드럼은 마디마다 패턴이 이어지게.
- 노트를 격자에 기계적으로 맞추지 말고 당김음·쉼표·강약 변화를 사용하고, 반복 구간의 마지막 마디에는 변화를 준다.
- 합성음 리드(80~87번)는 장르상 필요할 때만 사용하고, 기존 곡을 고칠 때는 곡의 스타일과 구조를 존중한다.`;

function toMidi(n) {
  const m = /^([A-Ga-g])([#b]?)(-?\d)$/.exec(String(n).trim());
  if (!m) return null;
  const v = SEMI[m[1].toUpperCase()] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
  return v >= 0 && v <= 127 ? v : null;
}
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function normalize(r) {
  const bpm = clamp(Math.round(+r.bpm || 100), 50, 200), bpb = clamp(Math.round(+r.beatsPerBar || 4), 2, 7);
  const bars = clamp(Math.round(+r.totalBars || 8), 1, 64), total = bpb * bars;
  const insts = (r.instruments || []).filter((i) => i && i.id).map((i) => ({
    ...i, program: clamp(Math.round(+i.program || 0), 0, 127), volume: clamp(+(i.volume ?? 0.8), 0, 1) }));
  if (!insts.length) throw new Error('악기가 없습니다');
  const by = new Map(insts.map((i) => [i.id, i]));
  const tracks = [];
  for (const t of r.tracks || []) {
    const inst = by.get(t.instrumentId); if (!inst) continue;
    const notes = [];
    for (const n of t.notes || []) {
      const s = +n.start; if (!(s >= 0 && s < total)) continue;
      const midi = inst.drums ? DRUMS[String(n.pitch).toLowerCase()] : toMidi(n.pitch);
      if (midi == null) continue;
      notes.push({ pitch: n.pitch, midi, start: s, duration: clamp(+n.duration || 0.5, 0.0625, total - s), velocity: clamp(+(n.velocity ?? 0.8), 0.05, 1) });
    }
    tracks.push({ instrumentId: t.instrumentId, notes: notes.sort((a, b) => a.start - b.start) });
  }
  if (!tracks.some((t) => t.notes.length)) throw new Error('노트가 없습니다');
  return { title: r.title || 'Untitled', bpm, key: r.key, scale: r.scale, beatsPerBar: bpb, totalBars: bars,
           instruments: insts, chordProgression: r.chordProgression || [], tracks };
}

// ---- 패턴 엔진: AI는 곡의 설계도(구조·코드·멜로디)만 만들고, 드럼·베이스·반주는 코드가 생성 ----
const ST = {
  pop:    { k: [0, 6, 8, 10], s: [4, 12], h: 2, comp: [0, 1.5, 2, 3.5], bass: [0, 1.5, 2, 3.5], sw: 0 },
  dance:  { k: [0, 4, 8, 12], s: [4, 12], h: 2, comp: [0.5, 1.5, 2.5, 3.5], bass: [0.5, 1.5, 2.5, 3.5], sw: 0, oh: [2, 6, 10, 14] },
  hiphop: { k: [0, 7, 10], s: [8], h: 2, comp: [0, 1.5, 2.75], bass: [0, 0.75, 2, 3.25], sw: 0.05 },
  rock:   { k: [0, 8, 10], s: [4, 12], h: 2, comp: [0, 2], bass: [0, 0.5, 1, 1.5, 2, 2.5, 3, 3.5], sw: 0 },
  ballad: { k: [0, 10], s: [12], h: 2, comp: 'arp', bass: [0, 2], sw: 0 },
  funk:   { k: [0, 3, 10], s: [4, 12, 15], h: 1, comp: [0.75, 1.5, 2.25, 3, 3.5], bass: [0, 0.75, 1.5, 2, 2.75, 3.5], sw: 0 },
  lofi:   { k: [0, 7, 10], s: [4, 12], h: 2, comp: [0, 1.5, 3], bass: [0, 1.5, 2, 3.25], sw: 0.07 },
};
const INST = { type: 'object', required: ['label', 'program'], properties: { label: { type: 'string' }, program: { type: 'integer', description: 'General MIDI 번호 0-127' } } };
const PLAN = {
  type: 'object', required: ['title', 'bpm', 'key', 'scale', 'style', 'instruments', 'sections'],
  properties: {
    title: { type: 'string' }, bpm: { type: 'integer' }, key: { type: 'string' }, scale: { type: 'string' },
    style: { type: 'string', enum: Object.keys(ST), description: '리듬 성격에 가장 가까운 것' },
    instruments: { type: 'object', required: ['melody', 'chords', 'bass'], properties: { melody: INST, chords: INST, bass: INST, pad: INST } },
    sections: { type: 'array', items: { type: 'object', required: ['name', 'bars', 'energy'], properties: {
      name: { type: 'string' }, bars: { type: 'integer' }, energy: { type: 'integer', description: '1(잔잔)~5(최고조)' },
      sameAs: { type: 'integer', description: '앞선 구간 번호(0부터)의 코드와 멜로디를 그대로 재사용' },
      chords: { type: 'array', items: { type: 'string' }, description: '마디당 코드 기호 하나 (C, Am7, Fmaj7, G/B)' },
      melody: { type: 'array', items: { type: 'object', required: ['pitch', 'start', 'duration'], properties: {
        pitch: { type: 'string', description: '음 이름 (C5, Bb4)' }, start: { type: 'number', description: '구간 시작 기준 박 단위(0부터)' },
        duration: { type: 'number' }, velocity: { type: 'number' } } } } } } }
  }
};
const PLAN_SYSTEM = `당신은 프로듀서 겸 작곡가입니다. 곡의 설계도를 지정된 JSON 스키마에 맞춰 출력하세요. 드럼·베이스·코드 반주는 style에 맞춰 코드가 자동 생성하므로, 당신은 곡의 뼈대와 멜로디에 집중합니다.
- 구조: 요청한 길이에 맞춰 sections를 구성합니다(예: 인트로 → 벌스 → 프리코러스 → 코러스 → 브리지 → 코러스 → 아웃트로). 길이 요청이 없으면 전체 32마디 전후. 같은 구간이 다시 나오면 sameAs로 재사용하고 energy만 바꿔 변화를 줍니다.
- energy: 인트로·브리지는 낮게, 코러스는 가장 높게 두어 곡 전체의 기승전결을 설계합니다.
- 화성: chords는 마디당 하나. 4마디 또는 8마디 단위로 순환시키되 벌스와 코러스의 진행을 다르게 하고, 곡의 끝은 으뜸화음으로 해결합니다.
- 멜로디: melody의 start는 구간 시작 기준 박 단위입니다. sameAs가 없는 구간은 모두 채웁니다. 2~4마디 모티프를 만들어 반복·변주하고, 코러스는 벌스보다 음역이 높고 리듬이 뚜렷하게 합니다. 코드 구성음을 강박에, 경과음을 약박에 두고, 음역은 C4~C6 안에서 도약과 순차 진행을 섞습니다. 4분·8분·점음표·당김음을 섞고 쉼표로 숨 쉴 자리를 만듭니다. velocity로 프레이즈의 강약을 표현합니다.
- 악기(program은 GM 번호): melody는 선율이 또렷한 음색, chords는 반주 음색, bass는 32~39번대, pad는 선택입니다. 합성음 리드(80~87번)는 장르상 필요할 때만 사용합니다.`;

const NM = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const nm = (m) => NM[m % 12] + (Math.floor(m / 12) - 1);
const pcOf = (n) => (SEMI[n[0].toUpperCase()] + (n[1] === '#' ? 1 : n[1] === 'b' ? -1 : 0) + 12) % 12;
function chordInfo(sym) {
  const m = /^([A-Ga-g][#b]?)([^/]*)(?:\/([A-Ga-g][#b]?))?$/.exec(String(sym || '').trim());
  if (!m) return null;
  const q = m[2], minor = /^m(?!aj)/.test(q) || /^min|dim/.test(q);
  const iv = [0, minor ? 3 : /sus2/.test(q) ? 2 : /sus/.test(q) ? 5 : 4, /dim/.test(q) ? 6 : /aug|\+/.test(q) ? 8 : 7];
  if (/maj7|M7|maj9/.test(q)) iv.push(11); else if (!/add9/.test(q) && /7|9/.test(q)) iv.push(10); else if (/6/.test(q)) iv.push(9);
  if (/9/.test(q)) iv.push(14);
  return { pc: pcOf(m[1]), bass: m[3] ? pcOf(m[3]) : pcOf(m[1]), iv };
}
function voice(c, prev) {
  const v = c.iv.map((i) => { let m = 48 + c.pc + i; while (m < 55) m += 12; while (m >= 74) m -= 12; return m; }).sort((a, b) => a - b);
  if (!prev) return v;
  const avg = (a) => a.reduce((s, x) => s + x, 0) / a.length, tg = avg(prev);
  let best = v, bd = Math.abs(avg(v) - tg), up = v, dn = v;
  for (let k = 0; k < v.length; k++) { // 전위: 최저음을 올리거나 최고음을 내려 직전 코드에 가깝게
    up = [...up.slice(1), up[0] + 12]; dn = [dn[dn.length - 1] - 12, ...dn.slice(0, -1)];
    if (up[up.length - 1] < 78 && Math.abs(avg(up) - tg) < bd) { best = up; bd = Math.abs(avg(up) - tg); }
    if (dn[0] >= 52 && Math.abs(avg(dn) - tg) < bd) { best = dn; bd = Math.abs(avg(dn) - tg); }
  }
  return best;
}

function build(plan) {
  const st = ST[plan.style] || ST.pop, B = 4, ins = plan.instruments || {}, secs = [];
  (plan.sections || []).forEach((x, i) => {
    const src = x.sameAs != null && x.sameAs < i && secs[x.sameAs] ? secs[x.sameAs] : x;
    secs.push({ bars: Math.max(1, Math.round(src.bars || x.bars || 4)), energy: clamp(Math.round(x.energy || 3), 1, 5), chords: src.chords || [], melody: src.melody || [] });
  });
  const J = (x) => Math.max(0, x + (Math.random() - 0.5) * 0.03), V = (v, r = 0.06) => clamp(v + (Math.random() - 0.5) * 2 * r, 0.05, 1);
  const sw = (t) => (Math.round(t * 4) % 4 === 2 ? st.sw : 0);
  const mel = [], cho = [], bas = [], pad = [], drm = [], chordsOut = [];
  let off = 0, pv = null;
  secs.forEach((sec, si) => {
    const e = sec.energy, len = sec.bars * B;
    sec.melody.forEach((n) => { if (n.start >= 0 && n.start < len) mel.push({ ...n, start: off + n.start, duration: Math.min(n.duration, len - n.start) }); });
    for (let b = 0; b < sec.bars; b++) {
      const t0 = off + b * B, sym = sec.chords.length ? sec.chords[b % sec.chords.length] : '', c = chordInfo(sym);
      if (sym) chordsOut.push({ bar: t0 / B + 1, chord: sym });
      if (c) {
        const tones = voice(c, pv); pv = tones;
        if (Array.isArray(st.comp)) st.comp.forEach((o, i) => {
          const d = Math.max(0.25, ((st.comp[i + 1] ?? B) - o) * 0.92);
          tones.forEach((m) => cho.push({ pitch: nm(m), start: J(t0 + o + sw(o)), duration: d, velocity: V(o % 1 ? 0.5 : 0.62) }));
        });
        else for (let i = 0; i < 8; i++) cho.push({ pitch: nm(tones[[0, 1, 2, 3, 2, 1, 2, 1][i] % tones.length]), start: t0 + i * 0.5, duration: 0.9, velocity: V(0.5) });
        const bo = e <= 1 ? st.bass.slice(0, 1) : st.bass;
        bo.forEach((o, i) => {
          const fifth = i === bo.length - 1 && i > 0 && b % 2 === 1;
          bas.push({ pitch: nm(36 + (fifth ? (c.bass + 7) % 12 : c.bass)), start: J(t0 + o + sw(o)), duration: Math.max(0.25, ((bo[i + 1] ?? B) - o) * 0.9), velocity: V(o === 0 ? 0.9 : 0.75) });
        });
        if (ins.pad) tones.forEach((m) => pad.push({ pitch: nm(m), start: t0, duration: B * 0.98, velocity: 0.28 + 0.05 * e }));
      }
      if (e >= 2) {
        const fill = b === sec.bars - 1 && si < secs.length - 1, hs = e === 2 ? 4 : e >= 5 ? Math.max(1, st.h / 2) : st.h;
        for (let q = 0; q < 16; q += hs) drm.push({ pitch: st.oh && e >= 3 && st.oh.includes(q) ? 'open_hat' : 'hat', start: J(t0 + q / 4 + sw(q / 4)), duration: 0.2, velocity: V(q % 4 === 0 ? 0.55 : 0.36, 0.05) });
        st.k.forEach((q) => drm.push({ pitch: 'kick', start: J(t0 + q / 4), duration: 0.25, velocity: V(q === 0 ? 0.95 : 0.8) }));
        st.s.filter((q) => !(fill && q >= 12)).forEach((q) => {
          drm.push({ pitch: 'snare', start: J(t0 + q / 4), duration: 0.25, velocity: V(0.85) });
          if (plan.style === 'dance') drm.push({ pitch: 'clap', start: J(t0 + q / 4), duration: 0.25, velocity: V(0.7) });
        });
        if (b === 0 && e >= 4) drm.push({ pitch: 'crash', start: t0, duration: 1, velocity: 0.8 });
        if (fill) [12, 13, 14, 15].forEach((q, k) => drm.push({ pitch: k % 2 ? 'tom' : 'snare', start: t0 + q / 4, duration: 0.25, velocity: 0.6 + k * 0.1 }));
      }
    }
    off += len;
  });
  const mk = (id, role, o, vol) => ({ id, label: o.label || id, program: clamp(Math.round(o.program ?? 0), 0, 127), role, volume: vol });
  const instruments = [mk('melody', 'melody', ins.melody || {}, 0.9), mk('chords', 'harmony', ins.chords || {}, 0.6), mk('bass', 'bass', ins.bass || { program: 33 }, 0.85)];
  if (ins.pad) instruments.push(mk('pad', 'pad', ins.pad, 0.5));
  instruments.push({ id: 'drums', label: '드럼', drums: true, role: 'rhythm', volume: 0.85 });
  return {
    title: plan.title, bpm: plan.bpm, key: plan.key, scale: plan.scale, beatsPerBar: B, totalBars: off / B, instruments, chordProgression: chordsOut,
    tracks: [['melody', mel], ['chords', cho], ['bass', bas], ...(ins.pad ? [['pad', pad]] : []), ['drums', drm]].map(([id, notes]) => ({ instrumentId: id, notes })),
  };
}

// Gemini의 responseSchema는 타입 이름을 대문자로 받는 것이 가장 안전해서 변환
const up = (o) => Array.isArray(o) ? o.map(up) : o && typeof o === 'object'
  ? Object.fromEntries(Object.entries(o).map(([k, v]) => [k, k === 'type' && typeof v === 'string' ? v.toUpperCase() : up(v)])) : o;

async function compose(prompt, feedback, plan) {
  const key = $('k').value.trim();
  if (!key) throw new Error('API 키를 입력하세요');
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`, {
    method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: plan ? PLAN_SYSTEM : SYSTEM }] },
      contents: [{ role: 'user', parts: [{ text: feedback ? `${prompt}\n\n[이전 결과의 문제] ${feedback}\n고쳐서 다시 출력하세요.` : prompt }] }],
      generationConfig: { responseMimeType: 'application/json', responseSchema: up(plan ? PLAN : SCHEMA), maxOutputTokens: 32768 }
    })
  });
  if (!res.ok) throw new Error(`API ${res.status}: ${(await res.text()).slice(0, 200)}`);
  const data = await res.json();
  const text = (data.candidates?.[0]?.content?.parts || []).map((x) => x.text || '').join('').replace(/```json|```/g, '').trim();
  if (!text) throw new Error('빈 응답입니다 (안전 필터 또는 토큰 한도)');
  const obj = JSON.parse(text);
  return normalize(plan ? build(obj) : obj);
}

// ---- 오디오 엔진 (WebAudioFont: 실제 샘플 기반 GM 악기) ----
let ctx, player, comp, timer, raf, graph, base, playing = false, bpm = 100, tr = 0, rev = 0.25, rng = [48, 72], mix = {};
const loaded = new Set(), esc = (s) => String(s).replace(/[<>&"]/g, ''), pad4 = (n) => String(n * 10).padStart(4, '0');
const total = () => comp.totalBars * comp.beatsPerBar;
const audible = (id) => { const m = mix[id], s = Object.values(mix).some((x) => x.solo); return !m.mute && (!s || m.solo); };
const curBeat = () => base ? base.beat + Math.max(0, ctx.currentTime - base.time) / base.spb : 0;

async function loadAll() {
  const ld = (u, v) => { if (!loaded.has(v) && !window[v]) player.loader.startLoad(ctx, u, v); loaded.add(v); };
  for (const i of comp.instruments) {
    if (i.drums) new Set(comp.tracks.filter((t) => t.instrumentId === i.id).flatMap((t) => t.notes.map((n) => n.midi)))
      .forEach((d) => ld(`${BASE}128${d}_0_FluidR3_GM_sf2_file.js`, `_drum_${d}_0_FluidR3_GM_sf2_file`));
    else ld(`${BASE}${pad4(i.program)}_FluidR3_GM_sf2_file.js`, `_tone_${pad4(i.program)}_FluidR3_GM_sf2_file`);
  }
  await new Promise((r) => player.loader.waitLoad(r));
}

function buildGraph() {
  const master = ctx.createDynamicsCompressor(); master.connect(ctx.destination);
  const conv = ctx.createConvolver(), n = ctx.sampleRate * 2, ir = ctx.createBuffer(2, n, ctx.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3); }
  conv.buffer = ir;
  const wet = ctx.createGain(); wet.gain.value = rev; conv.connect(wet); wet.connect(master);
  const gains = {};
  for (const i of comp.instruments) { const g = ctx.createGain(); g.connect(master); g.connect(conv); gains[i.id] = g; }
  graph = { master, wet, gains }; applyMix();
}
function applyMix() {
  if (graph) for (const id in graph.gains) graph.gains[id].gain.setTargetAtTime(audible(id) ? mix[id].vol : 0, ctx.currentTime, 0.02);
}

// beat 위치부터 현재 템포/키 설정으로 노트를 예약 (템포·키 변경 시 현재 위치에서 다시 호출)
function schedule(beat) {
  player.cancelQueue(ctx);
  const spb = 60 / bpm, t0 = ctx.currentTime + 0.15;
  base = { beat, time: t0, spb };
  for (const t of comp.tracks) {
    const inst = comp.instruments.find((i) => i.id === t.instrumentId), g = graph.gains[inst.id];
    for (const n of t.notes) {
      if (n.start < beat) continue;
      const preset = window[inst.drums ? `_drum_${n.midi}_0_FluidR3_GM_sf2_file` : `_tone_${pad4(inst.program)}_FluidR3_GM_sf2_file`];
      if (preset) player.queueWaveTable(ctx, g, preset, t0 + (n.start - beat) * spb, n.midi + (inst.drums ? 0 : tr), inst.drums ? 1.2 : n.duration * spb, n.velocity * 0.7);
    }
  }
  const lp = $('lp').checked;
  clearTimeout(timer); timer = setTimeout(lp ? () => schedule(0) : stop, ((total() - beat) * spb + (lp ? 0 : 2.5)) * 1000);
}

async function play(beat = 0) {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); player = player || new WebAudioFontPlayer();
  await ctx.resume(); $('st').textContent = '악기 샘플 불러오는 중…'; $('play').disabled = true;
  await loadAll(); if (!graph) buildGraph();
  schedule(beat); playing = true; $('st').textContent = ''; $('play').textContent = '■ 정지'; $('play').disabled = false; loop();
}
const seek = (b) => (playing ? schedule(b) : play(b));
function loop() { draw(curBeat()); if (playing) raf = requestAnimationFrame(loop); }
function stop() {
  playing = false; clearTimeout(timer); cancelAnimationFrame(raf);
  if (player && ctx) player.cancelQueue(ctx);
  $('play').textContent = '▶ 재생'; $('play').disabled = !comp; if (comp) draw(0);
}

// ---- 피아노롤 ----
function draw(beat) {
  const c = $('roll'), W = c.clientWidth, H = 240, d = devicePixelRatio || 1;
  $('pos').textContent = `${Math.min(comp.totalBars, Math.floor(beat / comp.beatsPerBar) + 1)} / ${comp.totalBars} 마디`;
  if (c.width !== Math.round(W * d)) { c.width = Math.round(W * d); c.height = H * d; }
  const g = c.getContext('2d'), dark = true, bx = W / total();
  g.setTransform(d, 0, 0, d, 0, 0); g.clearRect(0, 0, W, H);
  g.strokeStyle = dark ? '#38383c' : '#d9d6cf';
  for (let b = 0; b <= comp.totalBars; b++) { const x = b * comp.beatsPerBar * bx; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
    if (b < comp.totalBars && (comp.totalBars <= 16 || b % 4 === 0)) { g.fillStyle = dark ? '#a09d96' : '#6b6862'; g.font = '11px system-ui'; g.fillText(b + 1, x + 4, 12); } }
  const rows = rng[1] - rng[0] + 1, ph = H - 36;
  comp.tracks.forEach((t) => {
    const k = comp.instruments.findIndex((i) => i.id === t.instrumentId), inst = comp.instruments[k];
    g.fillStyle = `hsla(${k * 65 + 220},65%,${dark ? 65 : 45}%,${audible(inst.id) ? 0.9 : 0.18})`;
    for (const n of t.notes) {
      if (inst.drums) g.fillRect(n.start * bx, H - 14, Math.max(2, bx * 0.2), 10);
      else g.fillRect(n.start * bx, (rng[1] - n.midi) / rows * ph + 16, Math.max(2, n.duration * bx - 1), Math.max(2, ph / rows - 1));
    }
  });
  g.fillStyle = '#ff3b5c'; g.fillRect(Math.min(beat, total()) * bx - 1, 0, 2, H);
}
$('roll').onclick = (e) => { if (comp) seek((e.clientX - e.currentTarget.getBoundingClientRect().left) / e.currentTarget.clientWidth * total()); };

// ---- 곡 불러오기/표시 ----
const chip = (t) => `<span class="c">${esc(t)}</span>`;
function setComp(c) {
  stop(); if (graph) { graph.master.disconnect(); graph = null; }
  comp = c; bpm = c.bpm; tr = 0; mix = {}; c.instruments.forEach((i) => (mix[i.id] = { vol: i.volume }));
  const pm = c.tracks.flatMap((t) => (c.instruments.find((i) => i.id === t.instrumentId).drums ? [] : t.notes.map((n) => n.midi)));
  rng = pm.length ? [Math.min(...pm), Math.max(...pm)] : [48, 72];
  $('ti').textContent = c.title; $('meta').textContent = `${c.bpm} BPM · ${c.key || ''} ${c.scale || ''} · ${c.totalBars}마디`;
  $('ch').innerHTML = c.chordProgression.map((x) => chip(`${x.bar}마디 ${x.chord}`)).join('');
  $('bs').value = bpm; $('bv').textContent = bpm; $('ts').value = 0; $('tv').textContent = '0';
  $('mx').innerHTML = c.instruments.map((i, k) => `<div class="mr"><span><i class="sw" style="background:hsl(${k * 65 + 220},65%,50%)"></i>${esc(i.label)}</span><input type="range" min="0" max="1" step=".01" value="${i.volume}" data-v="${esc(i.id)}" aria-label="${esc(i.label)} 볼륨"><button data-m="${esc(i.id)}" title="뮤트(소리 끄기)">M</button><button data-s="${esc(i.id)}" title="솔로(이 악기만 듣기)">S</button></div>`).join('');
  $('et').innerHTML = '<option value="">모든 악기</option>' + c.instruments.map((i) => `<option value="${esc(i.id)}">${esc(i.label)}</option>`).join('');
  $('out').hidden = false; $('play').disabled = $('save').disabled = $('sv').disabled = $('mp3').disabled = false; draw(0);
}

// ---- 믹서·템포·키·리버브 ----
$('mx').addEventListener('input', (e) => { const id = e.target.dataset.v; if (id) { mix[id].vol = +e.target.value; applyMix(); } });
$('mx').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const id = b.dataset.m || b.dataset.s, k = b.dataset.m ? 'mute' : 'solo';
  mix[id][k] = !mix[id][k]; b.classList.toggle('on', mix[id][k]); applyMix(); draw(playing ? curBeat() : 0);
});
$('bs').oninput = (e) => ($('bv').textContent = e.target.value);
$('bs').onchange = (e) => { bpm = +e.target.value; if (playing) schedule(curBeat()); };
$('ts').oninput = (e) => ($('tv').textContent = (e.target.value > 0 ? '+' : '') + e.target.value);
$('ts').onchange = (e) => { tr = +e.target.value; if (playing) schedule(curBeat()); };
$('lp').onchange = () => { if (playing) schedule(curBeat()); };

// ---- 작곡 / 수정 / 부분 재생성 ----
try { $('k').value = localStorage.getItem('ak') || ''; } catch (e) {}
const gen = async (p, plan) => {
  try { localStorage.setItem('ak', $('k').value.trim()); } catch (e) {}
  try { return await compose(p, undefined, plan); } catch (e) { if (/^API/.test(e.message)) throw e; return await compose(p, e.message, plan); }
};
const busy = (b, m) => { $('gen').disabled = $('eb').disabled = b; $('gen').textContent = b ? '작곡 중…' : '작곡하기'; $('eb').textContent = b ? '수정 중…' : '수정하기'; if (m) $('st').textContent = m; };

$('gen').onclick = async () => {
  const o = [['장르', 'og'], ['키', 'ok'], ['BPM', 'ob'], ['마디 수', 'om'], ['악기', 'oi']].map(([l, i]) => $(i).value.trim() && `${l}: ${$(i).value.trim()}`).filter(Boolean);
  const p = [$('p').value.trim(), o.length && '[고급 옵션] ' + o.join(' / ')].filter(Boolean).join('\n');
  if (!p) return;
  stop(); busy(true, 'AI가 편곡 중입니다… (10~40초)');
  try { setComp(await gen(p, true)); $('st').textContent = '완료'; } catch (e) { $('st').textContent = '오류: ' + e.message; }
  busy(false);
};

// 범위(악기·마디) 안의 노트만 새 결과로 교체. 범위 밖은 원본 유지
function merge(o, n, ins, b0, b1) {
  const out = JSON.parse(JSON.stringify(o)), bpb = o.beatsPerBar, within = (x) => x >= b0 && x < b1;
  for (const t of out.tracks) {
    if (ins && t.instrumentId !== ins) continue;
    const nt = n.tracks.find((x) => x.instrumentId === t.instrumentId);
    t.notes = t.notes.filter((x) => !within(x.start)).concat((nt?.notes || []).filter((x) => within(x.start))).sort((a, b) => a.start - b.start);
  }
  if (!ins) out.chordProgression = o.chordProgression.filter((c) => !within((c.bar - 1) * bpb)).concat(n.chordProgression.filter((c) => within((c.bar - 1) * bpb)));
  return out;
}

$('eb').onclick = async () => {
  const ins = $('et').value, bpb = comp.beatsPerBar;
  const a = clamp(+$('e0').value || 1, 1, comp.totalBars), z = clamp(+$('e1').value || comp.totalBars, a, comp.totalBars);
  const whole = !ins && a === 1 && z === comp.totalBars;
  const rule = whole ? '요청에 필요하면 bpm·악기·코드·노트를 모두 바꿀 수 있다.' : '악기 id, bpm, 마디 수는 유지하고 수정 범위 밖의 노트는 그대로 둔다.';
  const p = `현재 곡(JSON):\n${JSON.stringify(comp, (k, v) => (k === 'midi' ? undefined : v))}\n\n수정 요청: ${$('ei').value.trim() || '같은 분위기로 새롭게 다시 만들어줘'}\n수정 범위: ${whole ? '곡 전체' : `${ins ? '악기 ' + ins : '모든 악기'}의 ${a}~${z}마디`}\n${rule} 수정된 곡 전체 JSON을 출력한다.`;
  stop(); busy(true, 'AI가 수정 중입니다…');
  try { const n = await gen(p); setComp(whole ? n : merge(comp, n, ins, (a - 1) * bpb, z * bpb)); $('st').textContent = '수정 완료'; }
  catch (e) { $('st').textContent = '오류: ' + e.message; }
  busy(false);
};

// ---- MP3 내보내기: 오프라인 렌더링 후 lamejs로 인코딩 ----
let lameP;
const loadLame = () => lameP || (lameP = new Promise((ok, no) => {
  if (window.lamejs) return ok();
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js';
  s.onload = ok;
  s.onerror = () => { lameP = null; no(new Error('MP3 인코더를 불러오지 못했습니다')); };
  document.head.appendChild(s);
}));

async function renderOffline() {
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  player = player || new WebAudioFontPlayer();
  await loadAll(); // 샘플 로드·디코딩 (이미 불러온 것은 재사용)
  const SR = 44100, spb = 60 / bpm, dur = total() * spb + 2.5;
  const oc = new OfflineAudioContext(2, Math.ceil(SR * dur), SR), op = new WebAudioFontPlayer();
  const master = oc.createDynamicsCompressor(); master.connect(oc.destination);
  const n = SR * 2, ir = oc.createBuffer(2, n, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3); }
  const conv = oc.createConvolver(); conv.buffer = ir;
  const wet = oc.createGain(); wet.gain.value = rev; conv.connect(wet); wet.connect(master);
  const gains = {};
  for (const i of comp.instruments) {
    const g = oc.createGain(); g.gain.value = audible(i.id) ? mix[i.id].vol : 0;
    g.connect(master); g.connect(conv); gains[i.id] = g;
  }
  for (const t of comp.tracks) {
    const inst = comp.instruments.find((i) => i.id === t.instrumentId);
    if (!audible(inst.id)) continue;
    for (const nt of t.notes) {
      const preset = window[inst.drums ? `_drum_${nt.midi}_0_FluidR3_GM_sf2_file` : `_tone_${pad4(inst.program)}_FluidR3_GM_sf2_file`];
      if (preset) op.queueWaveTable(oc, gains[inst.id], preset, 0.05 + nt.start * spb, nt.midi + (inst.drums ? 0 : tr), inst.drums ? 1.2 : nt.duration * spb, nt.velocity * 0.7);
    }
  }
  return oc.startRendering();
}

async function exportMp3() {
  $('mp3').disabled = true;
  try {
    $('st').textContent = 'MP3 변환 중… (악기 불러오기·렌더링)';
    await loadLame();
    const buf = await renderOffline();
    $('st').textContent = 'MP3 인코딩 중…';
    const i16 = (f) => { const o = new Int16Array(f.length); for (let i = 0; i < f.length; i++) o[i] = Math.max(-1, Math.min(1, f[i])) * 32767; return o; };
    const l = i16(buf.getChannelData(0)), r = i16(buf.getChannelData(1));
    const enc = new lamejs.Mp3Encoder(2, buf.sampleRate, 128), parts = [];
    for (let i = 0, k = 0; i < l.length; i += 1152, k++) {
      const b = enc.encodeBuffer(l.subarray(i, i + 1152), r.subarray(i, i + 1152));
      if (b.length) parts.push(b);
      if (k % 200 === 0) await new Promise((res) => setTimeout(res));
    }
    const tail = enc.flush(); if (tail.length) parts.push(tail);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(parts, { type: 'audio/mpeg' }));
    a.download = (comp.title || 'composition') + '.mp3'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    $('st').textContent = 'MP3를 저장했습니다';
  } catch (e) { $('st').textContent = '오류: ' + e.message; }
  $('mp3').disabled = !comp;
}
$('mp3').onclick = exportMp3;

// ---- 저장 / 불러오기 / 보관함 ----
$('play').onclick = () => (playing ? stop() : play());
$('save').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(comp, null, 2)], { type: 'application/json' }));
  a.download = (comp.title || 'composition') + '.json'; a.click(); URL.revokeObjectURL(a.href);
};
$('imp').onclick = () => $('f').click();
$('f').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { setComp(normalize(JSON.parse(await f.text()))); $('st').textContent = '불러왔습니다'; } catch (x) { $('st').textContent = '불러오기 실패: ' + x.message; }
  e.target.value = '';
};
const lib = () => { try { return JSON.parse(localStorage.getItem('lib') || '[]'); } catch (e) { return []; } };
const saveLib = (a) => { try { localStorage.setItem('lib', JSON.stringify(a)); } catch (e) { $('st').textContent = '저장 공간이 부족합니다'; } };
function renderLib() {
  $('lib').innerHTML = lib().map((x, i) => `<div class="mr"><span style="flex:1">${esc(x.comp.title)} <small>${esc(x.at)}</small></span><button data-l="${i}">불러오기</button><button data-d="${i}">삭제</button></div>`).join('') || '<small>저장된 곡이 없습니다</small>';
}
$('sv').onclick = () => { const a = lib(); a.unshift({ at: new Date().toLocaleString('ko-KR'), comp }); saveLib(a); renderLib(); $('st').textContent = '보관함에 저장했습니다'; };
$('lib').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const a = lib();
  if (b.dataset.l) setComp(normalize(a[b.dataset.l].comp)); else { if (!confirm('이 곡을 보관함에서 삭제할까요?')) return; a.splice(b.dataset.d, 1); saveLib(a); renderLib(); }
};
renderLib();

// ---- 사용성: 상태 알림, 예시, 단축키 ----
let stT;
new MutationObserver(() => {
  const t = $('st').textContent, err = /^오류|실패|부족/.test(t);
  $('st').className = err ? 'err' : /…/.test(t) ? 'busy' : '';
  clearTimeout(stT); if (t && !/…/.test(t)) stT = setTimeout(() => ($('st').textContent = ''), err ? 9000 : 3500);
}).observe($('st'), { childList: true });
$('ks').open = !$('k').value;
document.querySelectorAll('#ex button').forEach((b) => (b.onclick = () => { $('p').value = b.dataset.t; $('p').focus(); }));
$('p').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('gen').click(); });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && comp && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); $('play').click(); }
});
