<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>AI 작곡기</title>
<script src="https://surikov.github.io/webaudiofont/npm/dist/WebAudioFontPlayer.js"></script>
<style>
:root{color-scheme:dark;--bg:#07070a;--p1:#111116;--p2:#18181f;--p3:#22222b;--bd:#26262f;--bd2:#363642;--fg:#ececf2;--mut:#8a8a99;--ac:#35e6d4;--ac2:#6d8dff;--vio:#a77bff;--acf:#03201d;--err:#ff4466;--warn:#ffc83b;--glow:rgba(53,230,212,.28)}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#3a3a45 transparent}
::selection{background:rgba(53,230,212,.3)}
html,body{height:100%}
body{margin:0;color:var(--fg);font:14px/1.5 "Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(1200px 600px at 50% -10%,#15151e 0,var(--bg) 60%),var(--bg)}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100dvh}

/* 상단바: 로고 | 가운데 재생 컨트롤 | 오른쪽 저장·설정 */
.top{position:relative;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px 12px;min-height:56px;padding:8px 18px;background:rgba(17,17,22,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);box-shadow:0 8px 30px rgba(0,0,0,.35)}
.logo{justify-self:start;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:900;letter-spacing:-.01em;white-space:nowrap}
.logo b{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2) 60%,var(--vio));display:grid;place-items:center;color:var(--acf);font-size:14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 6px 18px var(--glow)}
.logo span{background:linear-gradient(90deg,#fff,#b9c4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tp{justify-self:center;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 14px;padding:4px 16px 4px 4px;background:rgba(24,24,31,.85);border:1px solid var(--bd);border-radius:16px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.tp b{min-width:88px;text-align:center;color:#fff;font:600 13px/1 ui-monospace,Menlo,monospace;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.act{justify-self:end;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:4px}
.act i{width:1px;height:18px;margin:0 6px;background:var(--bd)}
.top .act button{padding:0 12px;font-size:13px}

/* 버튼·입력 */
button{min-height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--bd);background:var(--p3);color:var(--fg);font:inherit;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,filter .15s,transform .1s,box-shadow .15s}
button:hover:not(:disabled){border-color:var(--bd2);background:#2d2d38}
button:active:not(:disabled){transform:scale(.97)}
button.main{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:var(--acf);font-weight:800;box-shadow:0 6px 20px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
button.main:hover:not(:disabled){background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;transform:translateY(-1px);filter:brightness(1.08)}
button.main:disabled{background:var(--p3);color:var(--mut);box-shadow:none;opacity:1}
button.on{background:var(--ac);border-color:var(--ac);color:var(--acf)}
button.on:hover:not(:disabled){background:var(--ac);border-color:var(--ac)}
button:disabled{opacity:.35;cursor:default}
.top button:not(.main){background:transparent;border-color:transparent;color:var(--mut)}
.top button:not(.main):hover:not(:disabled){background:var(--p3);color:var(--fg);border-color:transparent}
#play{min-width:98px;min-height:38px;padding:0 18px;border-radius:999px;border-color:transparent;background:linear-gradient(135deg,#fff,#d8e4ff);color:#111;box-shadow:0 4px 14px rgba(255,255,255,.18)}
#play:hover:not(:disabled){background:var(--ac);color:var(--acf);border-color:transparent}
#play:disabled{background:var(--p3);color:var(--mut);box-shadow:none}
.top #mp3{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:var(--acf);font-weight:800;box-shadow:0 6px 20px var(--glow),inset 0 1px 0 rgba(255,255,255,.35)}
.top #mp3:hover:not(:disabled){background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--acf);transform:translateY(-1px);filter:brightness(1.08)}
.top #mp3:disabled{background:var(--p3);color:var(--mut);box-shadow:none;opacity:.5}
button:focus-visible,summary:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
textarea,input,select{padding:9px 12px;border:1px solid var(--bd);border-radius:12px;background:#0c0c10;color:inherit;font:inherit;transition:border-color .15s,box-shadow .15s}
textarea:hover,input:hover,select:hover{border-color:var(--bd2)}
textarea:focus,input:focus,select:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(53,230,212,.15)}
::placeholder{color:#5d5d6c}
textarea,input:not([type=range]):not([type=checkbox]){width:100%}
textarea{min-height:120px;padding:12px 14px;line-height:1.6;font-size:13.5px;resize:vertical}
input[type=range]{-webkit-appearance:none;appearance:none;height:20px;padding:0;border:0;background:transparent;box-shadow:none;accent-color:var(--ac)}
input[type=range]:focus{box-shadow:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--p3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(53,230,212,.3),0 2px 6px rgba(0,0,0,.5)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--p3)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:#fff}
input[type=checkbox]{accent-color:var(--ac)}
label{display:flex;align-items:center;gap:6px;font-size:13px}
.f{flex-direction:column;align-items:stretch;gap:4px;font-size:12px;font-weight:700;color:var(--mut)}
.f select{width:100%}
small{color:var(--mut)}

/* 레이아웃 (button.main 과 겹치지 않게 div.main 으로 한정) */
div.main{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:0}
.panel{display:flex;flex-direction:column;min-height:0;overflow:auto;background:linear-gradient(180deg,var(--p1),#0d0d11);border-right:1px solid var(--bd)}
.panel.r{border-right:0;border-left:1px solid var(--bd)}
.ph{flex:none;display:flex;align-items:center;padding:11px 16px;font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--mut);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd);background:var(--p1)}
.ph::before{content:"";width:3px;height:12px;margin-right:9px;border-radius:2px;background:var(--ac);box-shadow:0 0 10px var(--glow)}
.ph:first-child{border-top:0}
.pane{padding:18px 16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.g1{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
details{margin:12px 0;padding:0 14px;background:var(--p2);border:1px solid var(--bd);border-radius:12px;transition:border-color .15s}
details:hover{border-color:var(--bd2)}
details[open]{padding-bottom:14px}
summary{display:flex;align-items:center;gap:6px;padding:11px 0;cursor:pointer;color:var(--fg);font-size:13px;font-weight:700;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"";flex:none;width:7px;height:7px;margin:-3px 3px 0 auto;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .15s,border-color .15s,margin .15s}
details[open]>summary::after{margin-top:3px;transform:rotate(-135deg)}
summary:hover{color:var(--ac)}
summary:hover::after{border-color:var(--ac)}
#ex{margin:10px 0 4px}
#ex button{min-height:0;padding:4px 12px;border-radius:999px;font-size:12px;font-weight:600;background:var(--p2)}
#ex button:hover:not(:disabled){border-color:var(--ac);color:var(--ac);background:rgba(53,230,212,.07)}
#gen{min-height:46px;border-radius:12px;font-size:15px}

/* 곡 영역: 제목줄 / 타임라인(DAW) / AI 수정 바 */
#out{grid-column:2;display:grid;grid-template-rows:auto minmax(0,1fr) auto;min-height:0;min-width:0}
#out[hidden]{display:none}
.empty{grid-column:2;display:grid;place-items:center;align-content:center;gap:14px;padding:24px;text-align:center;color:var(--mut);background:radial-gradient(620px 380px at 50% 45%,rgba(77,106,255,.11),transparent 70%),radial-gradient(#1f1f27 1px,transparent 1px) 0 0/22px 22px,var(--bg)}
.empty::before{content:"♪";display:grid;place-items:center;width:64px;height:64px;border-radius:20px;color:var(--ac);font-size:28px;background:linear-gradient(135deg,rgba(53,230,212,.18),rgba(109,141,255,.18));box-shadow:inset 0 0 0 1px rgba(255,255,255,.1),0 10px 30px rgba(0,0,0,.4)}
.empty b{color:var(--fg);font-size:15px}
#out:not([hidden])+.empty{display:none}
.info{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:12px 18px;background:var(--p1);border-bottom:1px solid var(--bd)}
.info h2{font-size:18px;font-weight:900;letter-spacing:-.01em;margin:0}
body.work .empty::before{animation:pulse 1.2s ease-in-out infinite}
body.work #roll{opacity:.45;pointer-events:none}
@keyframes pulse{50%{opacity:.35}}

/* 트랙(DAW): 왼쪽 악기 헤더 + 오른쪽 레인 */
#daw{--hw:188px;display:grid;grid-template-columns:var(--hw) minmax(0,1fr);align-content:start;overflow:auto;min-height:0;background:var(--bg)}
.corner{position:sticky;top:0;z-index:3;height:44px;padding:4px 12px;display:flex;align-items:center;background:var(--p1);border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);font-size:11px;line-height:1.4;color:var(--mut)}
#ruler{position:sticky;top:0;z-index:2;display:block;width:100%;border-bottom:1px solid var(--bd);cursor:pointer;touch-action:pan-y}
#roll{display:block;width:100%;cursor:crosshair;touch-action:pan-y}
#mx{background:var(--p1);border-right:1px solid var(--bd)}
.th{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--bd);border-left:3px solid transparent;overflow:hidden;transition:background .15s}
.th.sel{border-left-color:var(--c);background:var(--p2)}
.th .tn{min-height:24px;padding:0;border:0;background:none;text-align:left;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:800}
.th .tn:hover:not(:disabled){background:none;color:var(--ac)}
.th .sw{background:var(--c);vertical-align:0;box-shadow:0 0 8px var(--c)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:7px}
.tc{display:flex;align-items:center;gap:5px}
.tc input{flex:1;min-width:0}
.tc button{width:26px;min-height:24px;padding:0;border-radius:7px;font-size:11px}
.tc button[data-m].on,.tc button[data-m].on:hover:not(:disabled){background:var(--err);border-color:var(--err);color:#fff}
.tc button[data-s].on,.tc button[data-s].on:hover:not(:disabled){background:var(--warn);border-color:var(--warn);color:#2a2000}

/* AI 수정 바 */
.ai{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 18px 16px;background:linear-gradient(180deg,#111116,#0d0d11);border-top:1px solid var(--bd);box-shadow:0 -12px 30px rgba(0,0,0,.35)}
.ai::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--ac),var(--ac2),transparent);opacity:.5;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--bd2);background:var(--p2);color:var(--mut);font-size:12px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mut)}
.chip.on{border-color:rgba(53,230,212,.5);color:var(--ac);background:rgba(53,230,212,.08)}
.chip.on::before{background:var(--ac);box-shadow:0 0 8px var(--ac)}
#cl{min-height:36px;padding:0 12px;font-size:12px;color:var(--mut)}
.ai input{flex:1 1 260px;width:auto;min-width:0;height:40px;padding:0 16px;border-radius:12px;font-size:13.5px}
#eb{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 20px}
#eb::before{content:"✦";font-size:13px}
#ud{min-height:40px;padding:0 16px}

/* 상단 트랜스포트 */
.tf{gap:5px;color:var(--mut);font-size:12px;font-weight:700}
#bs,#ts{width:62px;padding:5px 7px;border-radius:8px}
.tf input[type=range]{width:76px}

/* 보관함 */
.mr{display:flex;align-items:center;gap:8px;margin:6px 0}
.mr button{min-height:30px;padding:0 10px;border-radius:8px;font-size:12px}
#lib .mr{padding:8px 10px;background:var(--p2);border:1px solid var(--bd);border-radius:12px;margin:6px 0;transition:border-color .15s}
#lib .mr:hover{border-color:var(--bd2)}
#lib .mr span{flex:1;white-space:normal}

/* 상태 알림 */
#st{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(92vw,560px);background:rgba(34,34,43,.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--bd2);color:var(--fg);padding:10px 16px;border-radius:14px;font-size:13px;z-index:9;box-shadow:0 12px 40px rgba(0,0,0,.5)}
#st:empty{display:none}
#st.err{background:var(--err);border-color:var(--err);color:#fff}
#st.busy::before{content:"";display:inline-block;width:12px;height:12px;margin-right:8px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){#st.busy::before,body.work .empty::before{animation:none}*{transition:none!important}}

@media(max-width:1100px){
.top{grid-template-columns:auto minmax(0,1fr)}
.tp{grid-column:1/-1;grid-row:2}
}
@media(max-width:900px){
html,body{height:auto}
.app{display:block;height:auto}
.top{position:sticky;top:0;padding:8px 14px}
div.main{display:block}
.panel,.panel.r{overflow:visible;border:0}
#out{display:block}
.empty{display:none}
#daw{--hw:132px;overflow:visible}
.corner,#ruler{top:57px}
.th .tc input{display:none}
.g2{grid-template-columns:1fr}
}

/* 재생바: 한 덩어리 캡슐, 안쪽은 플랫하게 */
.tp{gap:6px 18px;padding:4px 20px 4px 4px;border-radius:999px}
.tp b{align-self:center;min-width:92px;padding:0 18px 0 6px;line-height:22px;border-right:1px solid var(--bd)}
.tf{gap:7px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--mut)}
.tp #bs,.tp #ts{width:52px;height:30px;min-height:0;padding:0 6px;border:1px solid var(--bd2);border-radius:8px;background:#0c0c10;box-shadow:inset 0 1px 2px rgba(0,0,0,.5);cursor:text;color:#fff;text-align:center;font:600 13px/1 ui-monospace,Menlo,monospace;-moz-appearance:textfield;appearance:textfield}
.tp #bs::-webkit-inner-spin-button,.tp #ts::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.tp #bs:hover,.tp #ts:hover{border-color:#4a4a58}
.tp #bs:focus,.tp #ts:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(53,230,212,.15)}
.tf input[type=range]{width:72px}
.tp>label:not(.tf){gap:7px;color:var(--mut);font-size:12px;font-weight:700;cursor:pointer;user-select:none}
.tp>label:not(.tf):has(input:checked){color:var(--ac)}
.tp>label:not(.tf) input{width:15px;height:15px;margin:0;padding:0;border:0;cursor:pointer}
</style>
</head>
<body>
<div class="app">
<header class="top">
<div class="logo"><b>♪</b><span>AI 작곡기</span></div>
<div class="tp"><button id="play" class="main" disabled>▶ 재생</button><b id="pos">1 / 1 마디</b>
<label class="tf">BPM<input id="bs" type="number" min="50" max="200" value="100" aria-label="템포(BPM)"></label>
<label class="tf">키<input id="ts" type="number" min="-12" max="12" value="0" aria-label="키 이동(반음)" title="반음 단위로 키 이동"></label>
<label class="tf">리버브<input id="rs" aria-label="리버브" type="range" min="0" max="1" step=".01" value=".25"></label>
<label><input type="checkbox" id="lp"> 반복</label></div>
<div class="act"><button id="imp">불러오기</button><input id="f" type="file" accept=".json" hidden>
<button id="sv" disabled>보관함에 저장</button><button id="save" disabled>JSON 저장</button><button id="mp3" disabled>MP3 저장</button></div>
</header>
<div class="main">
<aside class="panel">
<div class="ph">곡 만들기</div>
<div class="pane">
<textarea id="p" placeholder="예: 비 오는 밤 재즈 카페 느낌, 느린 스윙, 피아노·콘트라베이스·브러시 드럼, 16마디"></textarea>
<div id="ex" class="row"><small>예시</small>
<button data-t="비 오는 밤 재즈 카페 느낌, 느린 스윙, 피아노·콘트라베이스·브러시 드럼, 16마디">재즈 카페</button>
<button data-t="신나는 8비트 게임 배경음악, 빠른 템포, 밝은 장조, 16마디">8비트 게임 BGM</button>
<button data-t="따뜻한 저녁 분위기의 잔잔한 어쿠스틱 기타 발라드, 느린 템포, 16마디">어쿠스틱 발라드</button></div>
<details><summary>고급 옵션</summary>
<div class="g2"><label class="f">장르<input id="og" placeholder="예: 로파이 힙합"></label><label class="f">키<input id="ok" placeholder="예: C, F#m"></label><label class="f">BPM<input id="ob" type="number" placeholder="50~200"></label><label class="f">마디 수<input id="om" type="number" placeholder="4~32"></label><label class="f" style="grid-column:1/-1">악기<input id="oi" placeholder="예: 피아노, 콘트라베이스, 브러시 드럼"></label></div>
</details>
<details id="ks"><summary>API 키 · 모델</summary>
<div class="g1">
<label class="f">Google AI Studio API 키<input id="k" type="password" placeholder="AIza…" autocomplete="off"></label>
<small style="margin-top:-4px">aistudio.google.com에서 발급 · 이 브라우저에만 저장</small>
<label class="f">모델<select id="md" aria-label="Gemini 모델"></select></label>
<input id="mc" placeholder="모델 ID 직접 입력 (예: gemini-3.8-flash)" hidden>
</div>
</details>
<button id="gen" class="main" title="Ctrl+Enter" style="width:100%;margin-top:6px">작곡하기</button>
</div>
<div class="ph">보관함</div>
<div class="pane"><div id="lib"></div></div>
</aside>
<div id="out" hidden>
<div class="info"><h2 id="ti"></h2><small id="meta"></small></div>
<div id="daw">
<div class="corner">악기 이름 클릭 = 선택<br>마디 드래그 = 구간 선택</div>
<canvas id="ruler" aria-label="마디 눈금: 클릭하면 그 위치부터 재생"></canvas>
<div id="mx"></div>
<canvas id="roll" aria-label="악기별 트랙: 클릭하면 그 위치부터 재생, 드래그하면 수정할 구간 선택"></canvas>
</div>
<div class="ai"><span id="sc" class="chip">모든 악기 · 전체 구간</span><button id="cl" hidden title="선택 해제 (Esc)">✕ 선택 해제</button>
<input id="ei" placeholder="곡 전체를 어떻게 바꿀까요? 예: 더 신나게, 템포를 올려줘"><button id="eb" class="main">수정하기</button><button id="ud" disabled>되돌리기</button></div>
</div>

    instruments: insts, chordProgression: r.chordProgression || [], tracks };
}

  if (!model) throw new Error('모델 ID를 입력하세요');
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST', headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: plan ? PLAN_SYSTEM : SYSTEM }] },
      contents: [{ role: 'user', parts: [{ text: feedback ? `${prompt}\n\n[이전 결과의 문제] ${feedback}\n고쳐서 다시 출력하세요.` : prompt }] }],
      generationConfig: { responseMimeType: 'application/json', responseSchema: up(plan ? PLAN : SCHEMA), maxOutputTokens: 32768 }
    })

  const oc = new OfflineAudioContext(2, Math.ceil(SR * dur), SR), op = new WebAudioFontPlayer();
  const master = oc.createDynamicsCompressor(); master.connect(oc.destination);
  const n = SR * 2, ir = oc.createBuffer(2, n, SR);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3); }
  const conv = oc.createConvolver(); conv.buffer = ir;
  const wet = oc.createGain(); wet.gain.value = rev; conv.connect(wet); wet.connect(master);
  const gains = {};
  for (const i of comp.instruments) {
    const g = oc.createGain(); g.gain.value = audible(i.id) ? mix[i.id].vol : 0;
    g.connect(master); g.connect(conv); gains[i.id] = g;
  }
  for (const t of comp.tracks) {
    const inst = comp.instruments.find((i) => i.id === t.instrumentId);
    if (!audible(inst.id)) continue;
    for (const nt of t.notes) {
      const preset = window[inst.drums ? `_drum_${nt.midi}_0_FluidR3_GM_sf2_file` : `_tone_${pad4(inst.program)}_FluidR3_GM_sf2_file`];
      if (preset) op.queueWaveTable(oc, gains[inst.id], preset, 0.05 + nt.start * spb, nt.midi + (inst.drums ? 0 : tr), inst.drums ? 1.2 : nt.duration * spb, nt.velocity * 0.7);
    }
  }
  return oc.startRendering();
}
async function exportMp3() {
  $('mp3').disabled = true;
  try {
    $('st').textContent = 'MP3 변환 중… (악기 불러오기·렌더링)';
    await loadLame();
    const buf = await renderOffline();
    $('st').textContent = 'MP3 인코딩 중…';
    const i16 = (f) => { const o = new Int16Array(f.length); for (let i = 0; i < f.length; i++) o[i] = Math.max(-1, Math.min(1, f[i])) * 32767; return o; };
    const l = i16(buf.getChannelData(0)), r = i16(buf.getChannelData(1));
    const enc = new lamejs.Mp3Encoder(2, buf.sampleRate, 128), parts = [];
    for (let i = 0, k = 0; i < l.length; i += 1152, k++) {
      const b = enc.encodeBuffer(l.subarray(i, i + 1152), r.subarray(i, i + 1152));
      if (b.length) parts.push(b);
      if (k % 200 === 0) await new Promise((res) => setTimeout(res));
    }
    const tail = enc.flush(); if (tail.length) parts.push(tail);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(parts, { type: 'audio/mpeg' }));
    a.download = (comp.title || 'composition') + '.mp3'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    $('st').textContent = 'MP3를 저장했습니다';
  } catch (e) { $('st').textContent = '오류: ' + e.message; }
  $('mp3').disabled = !comp;
}
$('mp3').onclick = exportMp3;

// ---- 저장 / 불러오기 / 보관함 ----
$('play').onclick = () => (playing ? stop() : play());
$('save').onclick = () => {
  dirty = false;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(comp, null, 2)], { type: 'application/json' }));
  a.download = (comp.title || 'composition') + '.json'; a.click(); URL.revokeObjectURL(a.href);
};
$('imp').onclick = () => $('f').click();
$('f').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try { setComp(normalize(JSON.parse(await f.text()))); dirty = false; $('st').textContent = '불러왔습니다'; } catch (x) { $('st').textContent = '불러오기 실패: ' + x.message; }
  e.target.value = '';
};
const lib = () => { try { return JSON.parse(localStorage.getItem('lib') || '[]'); } catch (e) { return []; } };
const saveLib = (a) => { try { localStorage.setItem('lib', JSON.stringify(a)); } catch (e) { $('st').textContent = '저장 공간이 부족합니다'; } };
function renderLib() {
  $('lib').innerHTML = lib().map((x, i) => `<div class="mr"><span style="flex:1">${esc(x.comp.title)} <small>${esc(x.at)}</small></span><button data-l="${i}">불러오기</button><button data-d="${i}">삭제</button></div>`).join('') || '<small>저장된 곡이 없습니다</small>';
}
$('sv').onclick = () => { dirty = false; const a = lib(); a.unshift({ at: new Date().toLocaleString('ko-KR'), comp }); saveLib(a); renderLib(); $('st').textContent = '보관함에 저장했습니다'; };
$('lib').onclick = (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const a = lib();
  if (b.dataset.l) { setComp(normalize(a[b.dataset.l].comp)); dirty = false; } else { if (!confirm('이 곡을 보관함에서 삭제할까요?')) return; a.splice(b.dataset.d, 1); saveLib(a); renderLib(); }
};
renderLib();
// 키·모델이 비어 있으면 해당 입력칸을 열어서 알려줌
const needKey = () => {
  if ($('k').value.trim() && modelId()) return false;
  $('ks').open = true; ($('k').value.trim() ? $('mc') : $('k')).focus(); $('st').textContent = '오류: API 키와 모델을 입력하세요';
  return true;
};
$('k').addEventListener('change', () => { try { localStorage.setItem('ak', $('k').value.trim()); } catch (e) {} });
$('cl').onclick = () => { rg = null; tgt = ''; if (comp) refresh(); };
$('ud').onclick = () => { if (hist.length) { setComp(hist.pop(), 'undo'); $('st').textContent = '되돌렸습니다'; } };
window.addEventListener('beforeunload', (e) => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && comp && (rg || tgt)) $('cl').click(); });
addEventListener('resize', () => comp && draw(playing ? curBeat() : 0));

// ---- 사용성: 상태 알림, 예시, 단축키 ----
let stT;
new MutationObserver(() => {
  const t = $('st').textContent, err = /^오류|실패|부족/.test(t);
  $('st').className = err ? 'err' : /…/.test(t) ? 'busy' : '';
  clearTimeout(stT); if (t && !/…/.test(t)) stT = setTimeout(() => ($('st').textContent = ''), err ? 9000 : 3500);
}).observe($('st'), { childList: true });
$('ks').open = !$('k').value;
document.querySelectorAll('#ex button').forEach((b) => (b.onclick = () => { $('p').value = b.dataset.t; $('p').focus(); }));
$('p').addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) $('gen').click(); });
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && comp && !/INPUT|TEXTAREA|SELECT|BUTTON/.test(document.activeElement.tagName)) { e.preventDefault(); $('play').click(); }
});
</script>
