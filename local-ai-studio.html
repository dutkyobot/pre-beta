<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1c1c1a;--sub:#74746f;--ln:#e3e3df;--ac:#2f5bea;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--tx:#ececea;--sub:#9a9a94;--ln:#302f2c;--ac:#6b8cff;--ok:#4cc17f;--warn:#e0a33c;--bad:#ef6b5b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:880px;margin:0 auto;padding:20px 16px;min-height:100vh;display:flex;flex-direction:column}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:18px;margin:0}
.sub{color:var(--sub);font-size:13px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:16px}
.big{cursor:pointer;text-align:left;font-size:16px}.big:hover,.model:hover{border-color:var(--ac)}.big b{font-size:19px;display:block;margin:6px 0 2px}

.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.rec{color:var(--ac);border-color:var(--ac)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}.btn.ghost{background:none;color:var(--tx);border:1px solid var(--ln)}.btn:disabled{opacity:.5;cursor:default}

.th{margin-bottom:6px;border:1px solid var(--ln);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--sub);white-space:normal}.th summary{cursor:pointer}

.tb{white-space:pre-wrap;max-height:200px;overflow:auto;margin:6px 0 2px;padding-top:6px;border-top:1px solid var(--ln)}.ans:empty{display:none}
/* 이미지 2단 */
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-areas:"p r" "g r";grid-template-rows:auto 1fr;align-items:start}
.pa{grid-area:p}.ga{grid-area:g}.ra{grid-area:r;display:flex;flex-direction:column;gap:10px}.ra #out{margin:0;max-width:none}

.pv{width:100%;max-height:360px;object-fit:contain;border:1px solid var(--ln);border-radius:10px;margin-top:8px;display:block;cursor:pointer}
.drop{cursor:pointer}.drop:hover,.drop.on{border-color:var(--ac);color:var(--tx)}
.chk{background:conic-gradient(#d4d4d0 25%,#fff 0 50%,#d4d4d0 0 75%,#fff 0) 0 0/16px 16px}
input[type=checkbox]{accent-color:var(--ac);margin-right:6px}
.del{padding:4px 12px;font-size:13px;color:var(--bad)}
/* 입력창 */
.comp{display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:24px;padding:6px 6px 6px 18px;position:sticky;bottom:12px;margin-top:8px}
.comp:focus-within{border-color:var(--ac)}
.comp textarea{border:0;background:none;outline:0;border-radius:0;padding:8px 0;max-height:160px;line-height:1.45}
.circ{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:18px;line-height:1;cursor:pointer}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);max-width:420px}
</style></head><body><div id="app"></div>
<!-- 모델 실행 Worker (Blob으로 생성). 라이브러리를 프로젝트에 포함하려면 LIB 경로를 로컬 파일로 바꾸면 됨 -->
<script type="text/plain" id="wk">
const LIB='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.1';
const ORT='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/';
let T,m,tok,proc,stopper,eng,ort,sd,pipe;

// ----- SD-Turbo (onnxruntime-web 직접 실행) -----
const half=f=>{const o=new Uint16Array(f.length),b=new Float32Array(1),u=new Uint32Array(b.buffer);
 for(let i=0;i<f.length;i++){b[0]=f[i];const x=u[0],s=(x>>>16)&0x8000,e=((x>>>23)&0xff)-112,mm=(x>>>13)&0x3ff;
  o[i]=e<=0?s:e>=31?(s|0x7c00):(s|(e<<10)|mm)}return o};
const unhalf=h=>{const o=new Float32Array(h.length);
 for(let i=0;i<h.length;i++){const x=h[i],s=x&0x8000?-1:1,e=(x>>10)&31,mm=x&1023;
  o[i]=e===0?s*mm*5.960464477539063e-8:e===31?(mm?NaN:s*Infinity):s*Math.pow(2,e-15)*(1+mm/1024)}return o};
const f32=raw=>raw instanceof Float32Array?raw:raw instanceof Uint16Array?unhalf(raw):Float32Array.from(raw);
const randn=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};

async function getBuf(url,label,pc){ // 큰 파일을 캐시에 저장하며 내려받기
 const c=await caches.open('sd-turbo');let r=await c.match(url);
 if(!r){
  r=await fetch(url);if(!r.ok)throw new Error(label+' 다운로드 실패 ('+r.status+')');
  const total=+r.headers.get('content-length')||0,rd=r.body.getReader(),ch=[];let got=0;
  for(;;){const {done,value}=await rd.read();if(done)break;ch.push(value);got+=value.length;pc({status:'progress',file:label,loaded:got,total:total||got})}
  const blob=new Blob(ch);ch.length=0;
  try{await c.put(url,new Response(blob))}catch(e){} // 저장 공간 부족하면 캐시만 건너뜀
  pc({status:'done',file:label});return await blob.arrayBuffer();
 }
 const b=await r.arrayBuffer();pc({status:'progress',file:label,loaded:b.byteLength,total:b.byteLength});pc({status:'done',file:label});return b;
}
async function loadSD(repo,pc){
 ort=await import(ORT+'ort.webgpu.min.mjs');
 ort.env.wasm.numThreads=1;ort.env.wasm.wasmPaths=ORT;
 const tk=await T.AutoTokenizer.from_pretrained('Xenova/clip-vit-base-patch16',{progress_callback:pc});
 const base='https://huggingface.co/'+repo+'/resolve/main/';
 const mk=dims=>({executionProviders:['webgpu'],enableMemPattern:false,enableCpuMemArena:false,graphOptimizationLevel:'all',freeDimensionOverrides:dims,
  extra:{session:{disable_prepacking:'1',use_device_allocator_for_initializers:'1'}}});
 const mkS=async(path,label,dims)=>{const b=await getBuf(base+path,label,pc);return await ort.InferenceSession.create(new Uint8Array(b),mk(dims))};
 const te=await mkS('text_encoder/model.onnx','text_encoder.onnx',{batch_size:1});
 const unet=await mkS('unet/model.onnx','unet.onnx',{batch_size:1,num_channels:4,height:64,width:64,sequence_length:77});
 const vae=await mkS('vae_decoder/model.onnx','vae_decoder.onnx',{batch_size:1,num_channels_latent:4,height_latent:64,width_latent:64});
 sd={tk,te,unet,vae};
}
async function genSD(prompt){
 const r=sd.tk(prompt,{truncation:true,max_length:77,return_tensor:false});
 let ids=r.input_ids;if(Array.isArray(ids[0]))ids=ids[0];ids=Array.from(ids,Number);
 if(ids.length>77){ids=ids.slice(0,77);ids[76]=49407}
 while(ids.length<77)ids.push(0);
 const tin=sd.te.inputNames[0];let eo;
 try{eo=await sd.te.run({[tin]:new ort.Tensor('int32',Int32Array.from(ids),[1,77])})}
 catch(e){eo=await sd.te.run({[tin]:new ort.Tensor('int64',BigInt64Array.from(ids,BigInt),[1,77])})}
 const hs=eo.last_hidden_state||Object.values(eo)[0];
 const fp16=hs.type==='float16';
 const T_=(a,dims)=>fp16?new ort.Tensor('float16',half(a),dims):new ort.Tensor('float32',a,dims);
 // 스케줄러: Euler Ancestral, 1스텝(timestep 999)
 let ac=1,sig=0;
 for(let i=0;i<1000;i++){const b=Math.pow(Math.sqrt(0.00085)+(Math.sqrt(0.012)-Math.sqrt(0.00085))*i/999,2);ac*=1-b;if(i===999)sig=Math.sqrt((1-ac)/ac)}
 const n=4*64*64,lat=new Float32Array(n),sc=1/Math.sqrt(sig*sig+1),inp=new Float32Array(n);
 for(let i=0;i<n;i++){lat[i]=randn()*sig;inp[i]=lat[i]*sc}
 const nm=sd.unet.inputNames,find=re=>nm.find(x=>re.test(x));
 const fs=find(/sample/i)||nm[0],ft=find(/time/i)||nm[1],fh=find(/hidden|encoder/i)||nm[2];
 let uo;
 try{uo=await sd.unet.run({[fs]:T_(inp,[1,4,64,64]),[ft]:new ort.Tensor('int64',BigInt64Array.from([999n]),[1]),[fh]:hs})}
 catch(e){uo=await sd.unet.run({[fs]:T_(inp,[1,4,64,64]),[ft]:T_(new Float32Array([999]),[1]),[fh]:hs})}
 const eps=f32(await (uo.out_sample||Object.values(uo)[0]).getData());
 const pr=new Float32Array(n);
 for(let i=0;i<n;i++)pr[i]=(lat[i]-sig*eps[i])/0.18215;
 // VAE 입력 정밀도가 UNet과 다를 수 있어 실패하면 반대로 재시도
 const vrun=f=>sd.vae.run({[sd.vae.inputNames[0]]:f?new ort.Tensor('float16',half(pr),[1,4,64,64]):new ort.Tensor('float32',pr,[1,4,64,64])});
 let vo;try{vo=await vrun(fp16)}catch(e){vo=await vrun(!fp16)}
 const px=f32(await (vo.sample||Object.values(vo)[0]).getData());
 const HW=px.length/3,W=Math.round(Math.sqrt(HW));
 const oc=new OffscreenCanvas(W,W),cx=oc.getContext('2d'),id=cx.createImageData(W,W);
 for(let i=0;i<HW;i++){for(let c=0;c<3;c++){const v=Math.min(1,Math.max(0,px[c*HW+i]/2+.5));id.data[i*4+c]=Math.round(v*255)}id.data[i*4+3]=255}
 cx.putImageData(id,0,0);
 postMessage({type:'img',blob:await oc.convertToBlob({type:'image/png'})});
}

onmessage=async({data:d})=>{
try{
if(d.type==='load'){
T=await import(LIB);eng=d.eng;
const pc=p=>postMessage({type:'prog',p});
if(eng==='chat'){
tok=await T.AutoTokenizer.from_pretrained(d.repo,{progress_callback:pc});
m=await T.AutoModelForCausalLM.from_pretrained(d.repo,{dtype:d.dtype,device:'webgpu',progress_callback:pc});
await m.generate({...tok('hi'),max_new_tokens:1}); // 워밍업(GPU 초기화)
}else if(eng==='janus'){
proc=await T.AutoProcessor.from_pretrained(d.repo,{progress_callback:pc});
m=await T.MultiModalityCausalLM.from_pretrained(d.repo,{progress_callback:pc,
dtype:{prepare_inputs_embeds:'q4',language_model:'q4f16',lm_head:'fp16',gen_head:'fp16',gen_img_embeds:'fp16',image_decode:'fp32'},
device:{prepare_inputs_embeds:'wasm',language_model:'webgpu',lm_head:'webgpu',gen_head:'webgpu',gen_img_embeds:'webgpu',image_decode:'webgpu'}});
}else if(eng==='sd'){
await loadSD(d.repo,pc);
}else if(eng==='bg'){ // RMBG-1.4
m=await T.AutoModel.from_pretrained(d.repo,{config:{model_type:'custom'},progress_callback:pc});
proc=await T.AutoProcessor.from_pretrained(d.repo,{progress_callback:pc,config:{do_normalize:true,do_pad:false,do_rescale:true,do_resize:true,image_mean:[0.5,0.5,0.5],feature_extractor_type:'ImageFeatureExtractor',image_std:[1,1,1],resample:2,rescale_factor:0.00392156862745098,size:{width:1024,height:1024}}});
}else if(eng==='modnet'){
m=await T.AutoModel.from_pretrained(d.repo,{progress_callback:pc});
proc=await T.AutoProcessor.from_pretrained(d.repo,{progress_callback:pc});
}else if(eng==='sr'){
pipe=await T.pipeline('image-to-image',d.repo,{progress_callback:pc});
}
postMessage({type:'ready'});
}else if(d.type==='chat'){
stopper=new T.InterruptableStoppingCriteria();
const inp=tok.apply_chat_template(d.messages,{add_generation_prompt:true,return_dict:true,...(d.noThink?{enable_thinking:false}:{})});
const pl=inp.input_ids.dims.at(-1);let nn=0;postMessage({type:'n',n:pl});
const st=new T.TextStreamer(tok,{skip_prompt:true,skip_special_tokens:true,callback_function:t=>postMessage({type:'tok',t}),token_callback_function:()=>postMessage({type:'n',n:pl+(++nn)})});
await m.generate({...inp,max_new_tokens:d.max,do_sample:true,temperature:.7,top_p:.9,streamer:st,stopping_criteria:stopper});
postMessage({type:'done'});
}else if(d.type==='count'){
const ids=tok.apply_chat_template([...d.messages,...(d.draft?[{role:'user',content:d.draft}]:[])],{add_generation_prompt:!!d.draft,tokenize:true,return_tensor:false,...(d.noThink?{enable_thinking:false}:{})});
postMessage({type:'cnt',n:ids.length});
}else if(d.type==='stop'){stopper&&stopper.interrupt()}
else if(d.type==='image'){
if(eng==='sd'){await genSD(d.prompt)}
else{
const inp=await proc([{role:'<|User|>',content:d.prompt}],{chat_template:'text_to_image'});
const n=proc.num_image_tokens;
const out=await m.generate_images({...inp,min_new_tokens:n,max_new_tokens:n,do_sample:true});
postMessage({type:'img',blob:await out[0].toBlob()});
}
}else if(d.type==='tool'){
const im=new T.RawImage(new Uint8ClampedArray(d.px),d.w,d.h,4).rgb();
if(eng==='sr'){
const o=await pipe(im),out=Array.isArray(o)?o[0]:o;
postMessage({type:'tres',data:out.data,w:out.width,h:out.height,c:out.channels});
}else{ // 배경 제거: 마스크만 돌려주고 합성은 화면 쪽에서
const {pixel_values}=await proc(im);
const {output}=await m({input:pixel_values});
const mk=output[0].mul(255).to('uint8');
postMessage({type:'tres',mask:mk.data,w:mk.dims.at(-1),h:mk.dims.at(-2)});
}
}
}catch(e){postMessage({type:'err',msg:String(e&&e.message||e)})}
};
</script>
<script>
// ===== 모델 레지스트리: 새 모델은 여기에 항목만 추가 =====
// kind: chat(대화) / image(텍스트→이미지) / tool(이미지 처리)
// engine: Worker가 모델을 돌리는 방식 (chat, janus, sd, bg, modnet, sr). 생략하면 kind와 같음
// cpu:true = WebGPU 없이 실행 / best:true = 해당 섹션(그룹)의 추천 표시 / grp = 섹션 안 소제목 / maxIn = 처리 모델 입력 긴 변 제한(px)
const MODELS=[
{id:'smollm2-360',kind:'chat',name:'SmolLM2 360M Instruct',repo:'HuggingFaceTB/SmolLM2-360M-Instruct',dtype:'q4f16',gb:0.25,minBuf:1,lang:'영어 중심',desc:'초경량·초고속. 답변 품질은 낮음',pri:1},
{id:'qwen25-05',kind:'chat',name:'Qwen2.5 0.5B Instruct',repo:'onnx-community/Qwen2.5-0.5B-Instruct',dtype:'q4f16',gb:0.4,minBuf:1,lang:'다국어(한국어 약함)',desc:'가볍고 빠름. 저사양·모바일용',pri:2},
{id:'qwen3-06',kind:'chat',name:'Qwen3 0.6B',repo:'onnx-community/Qwen3-0.6B-ONNX',dtype:'q4f16',gb:0.5,minBuf:1,lang:'다국어(한국어 보통)',desc:'최신 소형 모델 (사고 모드 끔)',noThink:true,pri:3},
{id:'tinyllama',kind:'chat',name:'TinyLlama 1.1B Chat',repo:'onnx-community/TinyLlama-1.1B-Chat-v1.0-ONNX',dtype:'q4f16',gb:0.7,minBuf:1,lang:'영어 중심',desc:'가벼운 영어 대화용',pri:4},
{id:'gemma3-1',kind:'chat',name:'Gemma 3 1B IT',repo:'onnx-community/gemma-3-1b-it-ONNX',dtype:'q4',gb:0.8,minBuf:1,lang:'다국어(한국어 양호)',desc:'구글 소형 모델, 소형 중 다국어 강점',pri:5},
{id:'llama32-1',kind:'chat',name:'Llama 3.2 1B Instruct',repo:'onnx-community/Llama-3.2-1B-Instruct-q4f16',dtype:'q4f16',gb:0.95,minBuf:2,lang:'영어 중심, 일부 다국어',desc:'균형형 소형 모델',pri:6},
{id:'smollm2-17',kind:'chat',name:'SmolLM2 1.7B Instruct',repo:'HuggingFaceTB/SmolLM2-1.7B-Instruct',dtype:'q4f16',gb:1.1,minBuf:2,lang:'영어 중심',desc:'영어 위주 작업에 적합',pri:7},
{id:'qwen25-15',kind:'chat',name:'Qwen2.5 1.5B Instruct',repo:'onnx-community/Qwen2.5-1.5B-Instruct',dtype:'q4f16',gb:1.2,minBuf:2,lang:'다국어(한국어 보통)',desc:'소형 중 답변 품질이 좋은 편',pri:8},
{id:'qwen3-17',kind:'chat',name:'Qwen3 1.7B',repo:'onnx-community/Qwen3-1.7B-ONNX',dtype:'q4f16',gb:1.3,minBuf:2,lang:'다국어(한국어 보통)',desc:'Qwen2.5보다 새로운 세대 (사고 모드 끔)',noThink:true,pri:9},

<div class="row" style="margin-top:10px"><button class="btn" id="go">이미지 생성</button><button class="btn ghost" id="tr">영어로 번역</button><span class="sub" id="tm"></span></div></div>
<div class="card ga"><b>이전 이미지</b><div class="gal" id="gl" style="margin-top:8px"></div><div class="sub" id="ge">아직 생성한 이미지가 없습니다</div></div>
<div class="card ra"><b>생성 결과</b><div class="ph" id="ph">생성된 이미지가 여기에 표시됩니다</div><div class="bar ind" id="gb" style="display:none"><i></i></div><img id="out" alt="" style="display:none"><button class="btn" id="sv" disabled>PNG 저장</button></div></div>`;
$('#bk').onclick=()=>pick('image');
const show=u=>{$('#out').src=u;$('#out').style.display='block';$('#ph').style.display='none';$('#sv').disabled=false};
const gal=()=>{$('#gl').innerHTML='';$('#ge').style.display=st.gal.length?'none':'block';st.gal.forEach(u=>{const i=new Image();i.src=u;i.onclick=()=>show(u);$('#gl').append(i)})};gal();
const rel=msg=>{st.busy=false;$('#go').disabled=$('#tr').disabled=false;$('#tm').textContent=msg};
const tryTr=(list,i,t)=>{if(i>=list.length)return rel('번역 실패: 모델을 불러오지 못했습니다');
const m=list[i],w=spawn();st.tw=w;let out='';$('#tm').textContent=`번역 모델 불러오는 중… (${m.name})`;
const next=()=>{w.terminate();tryTr(list,i+1,t)};w.onerror=next;
w.onmessage=({data:d})=>{
if(d.type==='ready'){$('#tm').textContent='번역 중…';w.postMessage({type:'chat',max:160,noThink:m.noThink,messages:[{role:'system',content:'Translate the user\'s Korean text into a natural English prompt for an image generator. Output only the English prompt.'},{role:'user',content:t}]})}
else if(d.type==='tok')out+=d.t;
else if(d.type==='done'){w.terminate();st.tw=null;const r=out.replace(/<think>[\s\S]*?<\/think>/g,'').replace(/<\/?think>/g,'').trim().replace(/^["']+|["']+$/g,'');
if(!r)return next();$('#pr').value=r;rel('번역 완료 · '+m.name)}
else if(d.type==='err')next()};
w.postMessage({type:'load',eng:'chat',repo:m.repo,dtype:m.dtype})};
$('#tr').onclick=async()=>{const t=$('#pr').value.trim();if(!t||st.busy)return;
if(!/[가-힣]/.test(t)){$('#tm').textContent='한글이 없어 번역할 내용이 없습니다';return}
const list=[];for(const id of ['qwen3-17','qwen25-15','gemma3-1','qwen3-06','qwen25-05']){const x=MODELS.find(v=>v.id===id);if(x.gb<=1.5&&fit(x)==='ok'&&await cached(x))list.push(x)}
if(!list.length)return alert('번역에 쓸 수 있는 다운로드된 대화 모델이 없습니다. 대화 모델(예: Qwen2.5 0.5B)을 먼저 받아 주세요.');
st.busy=true;$('#go').disabled=$('#tr').disabled=true;tryTr(list,0,t)};
$('#sv').onclick=()=>{const a=document.createElement('a');a.href=$('#out').src;a.download='image-'+Date.now()+'.png';a.click()};
$('#go').onclick=()=>{const p=$('#pr').value.trim();if(!p||st.busy)return;st.busy=true;$('#go').disabled=true;$('#gb').style.display='block';
const t0=Date.now(),iv=setInterval(()=>$('#tm').textContent='생성 중… '+Math.round((Date.now()-t0)/1000)+'초',1000);
const done=()=>{clearInterval(iv);st.busy=false;$('#go').disabled=false;$('#gb').style.display='none'};
st.worker.onmessage=({data:d})=>{
if(d.type==='img'){const u=URL.createObjectURL(d.blob);st.gal.unshift(u);show(u);gal();$('#tm').textContent='완료';done()}
else if(d.type==='err'){$('#tm').textContent='오류: '+d.msg;done()}};
st.worker.postMessage({type:'image',prompt:p})};
}
function toolView(){
const m=st.model,bg=m.engine!=='sr',lab=bg?'배경 제거':'업스케일';
const note=bg?'결과는 투명 배경 PNG로 저장됩니다.':`처리 속도 때문에 긴 변 ${m.maxIn}px까지만 입력되고, 결과는 ${m.id==='swin-x4'?4:2}배 크기입니다.`;
app.innerHTML=head(lab)+`<div class="two">
<div class="card pa"><b>원본 이미지</b><div class="sub">${note}</div>
<label class="ph drop" id="dz" for="fi" style="margin-top:8px">클릭하거나 이미지를 끌어다 놓으세요</label>
<img id="pv" class="pv" alt="" title="클릭하면 다른 이미지를 선택합니다" style="display:none"><input type="file" id="fi" accept="image/*" hidden>
<div class="row" style="margin-top:10px"><button class="btn" id="go" disabled>${lab}</button><span class="sub" id="tm"></span></div></div>
<div class="card ga"><b>이전 결과</b><div class="gal" id="gl" style="margin-top:8px"></div><div class="sub" id="ge">아직 처리한 이미지가 없습니다</div></div>
<div class="card ra"><b>처리 결과</b><div class="ph" id="rph">처리된 이미지가 여기에 표시됩니다</div><div class="bar ind" id="gb" style="display:none"><i></i></div><img id="out" alt="" style="display:none"><button class="btn" id="sv" disabled>PNG 저장</button></div></div>`;
$('#bk').onclick=()=>pick('tool');
let src=null;
const show=(u,b)=>{$('#out').classList.toggle('chk',b);$('#out').src=u;$('#out').style.display='block';$('#rph').style.display='none';$('#sv').disabled=false};
const gal=()=>{$('#gl').innerHTML='';$('#ge').style.display=st.tgal.length?'none':'block';
st.tgal.forEach(o=>{const i=new Image();i.src=o.u;if(o.bg)i.className='chk';i.onclick=()=>show(o.u,o.bg);$('#gl').append(i)})};gal();
const setSrc=f=>{if(!f||!f.type.startsWith('image/'))return;const u=URL.createObjectURL(f),im=new Image();
im.onload=()=>{src=im;$('#pv').src=u;$('#pv').style.display='block';$('#dz').style.display='none';$('#go').disabled=false;$('#tm').textContent=`${im.naturalWidth}×${im.naturalHeight}`};
im.onerror=()=>{$('#tm').textContent='이미지를 읽을 수 없습니다'};im.src=u};
$('#fi').onchange=e=>{setSrc(e.target.files[0]);e.target.value=''};
$('#pv').onclick=()=>$('#fi').click();
for(const el of [$('#dz'),$('#pv')]){
el.ondragover=e=>{e.preventDefault();$('#dz').classList.add('on')};
el.ondragleave=()=>$('#dz').classList.remove('on');
el.ondrop=e=>{e.preventDefault();$('#dz').classList.remove('on');setSrc(e.dataTransfer.files[0])}}
$('#sv').onclick=()=>{const a=document.createElement('a');a.href=$('#out').src;a.download=(bg?'cutout-':'upscaled-')+Date.now()+'.png';a.click()};
const compose=async d=>{let c;
if(bg){const W=src.naturalWidth,H=src.naturalHeight,mc=document.createElement('canvas');mc.width=d.w;mc.height=d.h;
const mi=new ImageData(d.w,d.h);for(let i=0;i<d.mask.length;i++)mi.data[i*4+3]=d.mask[i];
mc.getContext('2d').putImageData(mi,0,0);
c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
x.drawImage(src,0,0,W,H);x.globalCompositeOperation='destination-in';x.imageSmoothingQuality='high';x.drawImage(mc,0,0,W,H)}
else{c=document.createElement('canvas');c.width=d.w;c.height=d.h;
const id=new ImageData(d.w,d.h),n=d.w*d.h,ch=d.c;
for(let i=0;i<n;i++){for(let k=0;k<3;k++)id.data[i*4+k]=d.data[i*ch+(ch>=3?k:0)];id.data[i*4+3]=255}
c.getContext('2d').putImageData(id,0,0)}
const b=await new Promise(r=>c.toBlob(r,'image/png')),u=URL.createObjectURL(b);
st.tgal.unshift({u,bg});show(u,bg);gal()};
$('#go').onclick=()=>{if(!src||st.busy)return;st.busy=true;$('#go').disabled=true;$('#gb').style.display='block';
const sc=Math.min(1,(m.maxIn||1024)/Math.max(src.naturalWidth,src.naturalHeight)),w=Math.max(1,Math.round(src.naturalWidth*sc)),h=Math.max(1,Math.round(src.naturalHeight*sc));
const c=document.createElement('canvas');c.width=w;c.height=h;const cx=c.getContext('2d',{willReadFrequently:true});cx.drawImage(src,0,0,w,h);
const px=cx.getImageData(0,0,w,h).data.buffer;
const t0=Date.now(),iv=setInterval(()=>$('#tm').textContent='처리 중… '+Math.round((Date.now()-t0)/1000)+'초',1000);
const done=()=>{clearInterval(iv);st.busy=false;$('#go').disabled=false;$('#gb').style.display='none'};
st.worker.onmessage=async({data:d})=>{
if(d.type==='tres'){try{await compose(d);$('#tm').textContent='완료'}catch(e){$('#tm').textContent='오류: '+e.message}done()}
else if(d.type==='err'){$('#tm').textContent='오류: '+d.msg;done()}};
st.worker.postMessage({type:'tool',px,w,h},[px])};
}
home();
</script></body></html>
