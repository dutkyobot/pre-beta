<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Local AI Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext x='50' y='78' font-size='90' text-anchor='middle' fill='%232f5bea'%3E%E2%9C%B3%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1c1c1a;--sub:#74746f;--ln:#e3e3df;--ac:#2f5bea;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--tx:#ececea;--sub:#9a9a94;--ln:#302f2c;--ac:#6b8cff;--ok:#4cc17f;--warn:#e0a33c;--bad:#ef6b5b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
#app{max-width:880px;margin:0 auto;padding:20px 16px;min-height:100vh;display:flex;flex-direction:column}
h1{font-size:22px;margin:8px 0 4px}h2{font-size:18px;margin:0}
.sub{color:var(--sub);font-size:13px}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:16px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-top:16px}
.big{cursor:pointer;text-align:left;font-size:16px}.big:hover,.model:hover{border-color:var(--ac)}.big b{font-size:19px;display:block;margin:6px 0 2px}
.model{cursor:pointer;display:flex;flex-direction:column;gap:6px}.model.rec{border-color:var(--ac)}.model.no{opacity:.55}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--ln);color:var(--sub);margin-right:4px}
.tag.ok{color:var(--ok);border-color:var(--ok)}.tag.rec{color:var(--ac);border-color:var(--ac)}.tag.warn{color:var(--warn);border-color:var(--warn)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer}.btn.ghost{background:none;color:var(--tx);border:1px solid var(--ln)}.btn:disabled{opacity:.5;cursor:default}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .2s}
.bar.ind i{width:35%;animation:s 1.2s infinite ease-in-out}@keyframes s{0%{margin-left:-35%}100%{margin-left:100%}}
#msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:12px 0}
.m{max-width:85%;padding:9px 13px;border-radius:12px;white-space:pre-wrap;word-break:break-word}.m.u{align-self:flex-end;background:var(--ac);color:#fff}.m.a{align-self:flex-start;background:var(--card);border:1px solid var(--ln)}
textarea,input[type=text],input[type=number]{width:100%;background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:9px 12px}
textarea{resize:none}
.top{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
#set{display:none;margin-bottom:10px}#set.on{display:block}
#out{width:100%;max-width:512px;border-radius:10px;display:block;margin:12px 0}
.gal{display:flex;gap:8px;flex-wrap:wrap}.gal img{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--ln);cursor:pointer}
/* 파일별 다운로드 */
.fl{max-height:260px;overflow:auto;margin-top:12px;display:grid;gap:8px}.fr .bar{height:5px;margin:4px 0 0}.fr.dn{opacity:.55}.fn{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 생각 과정 */
.th{margin-bottom:6px;border:1px solid var(--ln);border-radius:8px;padding:4px 10px;font-size:13px;color:var(--sub);white-space:normal}.th summary{cursor:pointer}
.th.on summary::after{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ac);margin-left:8px;animation:pl 1s infinite}@keyframes pl{50%{opacity:.2}}
.tb{white-space:pre-wrap;max-height:200px;overflow:auto;margin:6px 0 2px;padding-top:6px;border-top:1px solid var(--ln)}.ans:empty{display:none}
/* 이미지 2단 */
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);grid-template-areas:"p r" "g r";grid-template-rows:auto 1fr;align-items:start}
.pa{grid-area:p}.ga{grid-area:g}.ra{grid-area:r;display:flex;flex-direction:column;gap:10px}.ra #out{margin:0;max-width:none}
.ph{aspect-ratio:1;border:1px dashed var(--ln);border-radius:10px;display:grid;place-items:center;color:var(--sub);font-size:13px;text-align:center;padding:12px}
@media(max-width:760px){.two{grid-template-columns:1fr;grid-template-areas:"p" "r" "g"}}
.del{padding:4px 12px;font-size:13px;color:var(--bad)}
/* 입력창 */
.comp{display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid var(--ln);border-radius:24px;padding:6px 6px 6px 18px;position:sticky;bottom:12px;margin-top:8px}
.comp:focus-within{border-color:var(--ac)}
.comp textarea{border:0;background:none;outline:0;border-radius:0;padding:8px 0;max-height:160px;line-height:1.45}
.circ{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:18px;line-height:1;cursor:pointer}
dialog{border:1px solid var(--ln);border-radius:12px;background:var(--card);color:var(--tx);max-width:420px}
</style></head><body><div id="app"></div>

<!-- 모델 실행 Worker (Blob으로 생성). 라이브러리를 프로젝트에 포함하려면 LIB 경로를 로컬 파일로 바꾸면 됨 -->
<script type="text/plain" id="wk">
const LIB='https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.1';
let T,m,tok,proc,stopper,kind;
onmessage=async({data:d})=>{
 try{
  if(d.type==='load'){
   T=await import(LIB);kind=d.kind;
   const pc=p=>postMessage({type:'prog',p});
   if(kind==='chat'){
    tok=await T.AutoTokenizer.from_pretrained(d.repo,{progress_callback:pc});
    m=await T.AutoModelForCausalLM.from_pretrained(d.repo,{dtype:d.dtype,device:'webgpu',progress_callback:pc});
    await m.generate({...tok('hi'),max_new_tokens:1}); // 워밍업(GPU 초기화)
   }else{
    proc=await T.AutoProcessor.from_pretrained(d.repo,{progress_callback:pc});
    m=await T.MultiModalityCausalLM.from_pretrained(d.repo,{progress_callback:pc,
     dtype:{prepare_inputs_embeds:'q4',language_model:'q4f16',lm_head:'fp16',gen_head:'fp16',gen_img_embeds:'fp16',image_decode:'fp32'},
     device:{prepare_inputs_embeds:'wasm',language_model:'webgpu',lm_head:'webgpu',gen_head:'webgpu',gen_img_embeds:'webgpu',image_decode:'webgpu'}});
   }
   postMessage({type:'ready'});
  }else if(d.type==='chat'){
   stopper=new T.InterruptableStoppingCriteria();
   const inp=tok.apply_chat_template(d.messages,{add_generation_prompt:true,return_dict:true,...(d.noThink?{enable_thinking:false}:{})});
   const pl=inp.input_ids.dims.at(-1);let nn=0;postMessage({type:'n',n:pl});
   const st=new T.TextStreamer(tok,{skip_prompt:true,skip_special_tokens:true,callback_function:t=>postMessage({type:'tok',t}),token_callback_function:()=>postMessage({type:'n',n:pl+(++nn)})});
   await m.generate({...inp,max_new_tokens:d.max,do_sample:true,temperature:.7,top_p:.9,streamer:st,stopping_criteria:stopper});
   postMessage({type:'done'});
  }else if(d.type==='count'){
   const ids=tok.apply_chat_template([...d.messages,...(d.draft?[{role:'user',content:d.draft}]:[])],{add_generation_prompt:!!d.draft,tokenize:true,return_tensor:false,...(d.noThink?{enable_thinking:false}:{})});
   postMessage({type:'cnt',n:ids.length});
  }else if(d.type==='stop'){stopper&&stopper.interrupt()}
  else if(d.type==='image'){
   const inp=await proc([{role:'<|User|>',content:d.prompt}],{chat_template:'text_to_image'});
   const n=proc.num_image_tokens;
   const out=await m.generate_images({...inp,min_new_tokens:n,max_new_tokens:n,do_sample:true});
   postMessage({type:'img',blob:await out[0].toBlob()});
  }
 }catch(e){postMessage({type:'err',msg:String(e&&e.message||e)})}
};
</script>

<script>
// ===== 모델 레지스트리: 새 모델은 여기에 항목만 추가 =====
const MODELS=[
 {id:'smollm2-360',kind:'chat',name:'SmolLM2 360M Instruct',repo:'onnx-community/SmolLM2-360M-Instruct',dtype:'q4f16',gb:0.25,minBuf:1,lang:'영어 중심',desc:'초경량·초고속. 답변 품질은 낮음',pri:1},
 {id:'qwen25-05',kind:'chat',name:'Qwen2.5 0.5B Instruct',repo:'onnx-community/Qwen2.5-0.5B-Instruct',dtype:'q4f16',gb:0.4,minBuf:1,lang:'다국어(한국어 약함)',desc:'가볍고 빠름. 저사양·모바일용',pri:2},
 {id:'qwen3-06',kind:'chat',name:'Qwen3 0.6B',repo:'onnx-community/Qwen3-0.6B-ONNX',dtype:'q4f16',gb:0.5,minBuf:1,lang:'다국어(한국어 보통)',desc:'최신 소형 모델 (사고 모드 끔)',noThink:true,pri:3},
 {id:'tinyllama',kind:'chat',name:'TinyLlama 1.1B Chat',repo:'onnx-community/TinyLlama-1.1B-Chat-v1.0-ONNX',dtype:'q4f16',gb:0.7,minBuf:1,lang:'영어 중심',desc:'가벼운 영어 대화용',pri:4},
 {id:'gemma3-1',kind:'chat',name:'Gemma 3 1B IT',repo:'onnx-community/gemma-3-1b-it-ONNX',dtype:'q4',gb:0.8,minBuf:1,lang:'다국어(한국어 양호)',desc:'구글 소형 모델, 소형 중 다국어 강점',pri:5},
 {id:'llama32-1',kind:'chat',name:'Llama 3.2 1B Instruct',repo:'onnx-community/Llama-3.2-1B-Instruct-q4f16',dtype:'q4f16',gb:0.95,minBuf:2,lang:'영어 중심, 일부 다국어',desc:'균형형 소형 모델',pri:6},
 {id:'smollm2-17',kind:'chat',name:'SmolLM2 1.7B Instruct',repo:'onnx-community/SmolLM2-1.7B-Instruct',dtype:'q4f16',gb:1.1,minBuf:2,lang:'영어 중심',desc:'영어 위주 작업에 적합',pri:7},
 {id:'qwen25-15',kind:'chat',name:'Qwen2.5 1.5B Instruct',repo:'onnx-community/Qwen2.5-1.5B-Instruct',dtype:'q4f16',gb:1.2,minBuf:2,lang:'다국어(한국어 보통)',desc:'소형 중 답변 품질이 좋은 편',pri:8},
 {id:'qwen3-17',kind:'chat',name:'Qwen3 1.7B',repo:'onnx-community/Qwen3-1.7B-ONNX',dtype:'q4f16',gb:1.3,minBuf:2,lang:'다국어(한국어 보통)',desc:'Qwen2.5보다 새로운 세대 (사고 모드 끔)',noThink:true,pri:9},
 {id:'deepseek-r1',kind:'chat',name:'DeepSeek-R1 Distill Qwen 1.5B',repo:'onnx-community/DeepSeek-R1-Distill-Qwen-1.5B-ONNX',dtype:'q4f16',gb:1.3,minBuf:2,think:true,lang:'영어·중국어 중심',desc:'추론 특화. 생각 과정을 접어서 표시',pri:10},
 {id:'phi35',kind:'chat',name:'Phi-3.5 mini Instruct',repo:'onnx-community/Phi-3.5-mini-instruct-onnx-web',dtype:'q4f16',gb:2.2,minBuf:2,lang:'영어 중심',desc:'3.8B급 고품질. 높은 사양 필요',pri:11},
 {id:'qwen3-4',kind:'chat',name:'Qwen3 4B',repo:'onnx-community/Qwen3-4B-ONNX',dtype:'q4f16',gb:2.8,minBuf:2,lang:'다국어(한국어 양호)',desc:'가장 큰 대화 모델. 고성능 GPU 권장',noThink:true,pri:12},
 {id:'janus-pro',kind:'image',name:'Janus-Pro 1B',repo:'onnx-community/Janus-Pro-1B-ONNX',gb:2.3,minBuf:2,lang:'영어 프롬프트 권장',desc:'텍스트→이미지 384×384. 생성에 수 분 걸릴 수 있음',pri:13},
 {id:'janus-13',kind:'image',name:'Janus 1.3B',repo:'onnx-community/Janus-1.3B-ONNX',gb:2.6,minBuf:2,lang:'영어 프롬프트 권장',desc:'Janus 초기 버전. Pro보다 품질은 낮음',pri:14}
];
const $=(s,r=document)=>r.querySelector(s);const app=$('#app');
const st={hw:null,kind:null,model:null,worker:null,files:{},hist:[],gal:[],busy:false,sys:'당신은 친절한 한국어 AI 어시스턴트입니다.',max:512};
const isMobile=/Android|iPhone|iPad|Mobi/i.test(navigator.userAgent)||(navigator.connection&&navigator.connection.type==='cellular');
const fmt=g=>g<1?Math.round(g*1000)+'MB':g.toFixed(1)+'GB';

async function detect(){
 const h={ok:false,name:'WebGPU 미지원',buf:0,mem:navigator.deviceMemory||0};
 try{const a=navigator.gpu&&await navigator.gpu.requestAdapter();
  if(a){const i=a.info||{};h.ok=true;h.buf=a.limits.maxBufferSize/2**30;
   h.name=[i.vendor,i.architecture,i.description].filter(Boolean).join(' ')||'GPU 감지됨'}}catch(e){}
 st.hw=h;
}
async function cached(m){ // 브라우저 캐시에 모델 파일이 있는지 확인
 try{for(const k of await caches.keys()){const c=await caches.open(k);
  if((await c.keys()).some(r=>r.url.includes('/'+m.repo+'/')))return true}}catch(e){}
 return false;
}
async function removeModel(m){let n=0;
 try{for(const k of await caches.keys()){const c=await caches.open(k);for(const r of await c.keys())if(r.url.includes('/'+m.repo+'/')){await c.delete(r);n++}}}catch(e){}
 return n}
function fit(m){const h=st.hw;if(!h.ok)return 'no';return h.buf>=m.minBuf?'ok':'low'}

function killWorker(){if(st.worker){st.worker.terminate();st.worker=null}st.busy=false}
function spawn(){const u=URL.createObjectURL(new Blob([$('#wk').textContent],{type:'text/javascript'}));
 return new Worker(u,{type:'module'})}

// ===== 화면 =====
async function home(){
 killWorker();st.kind=st.model=null;
 if(!st.hw)await detect();const h=st.hw;
 app.innerHTML=`<h1><span style="color:var(--ac)">✳</span> Local AI Studio</h1><div class="sub">모든 AI 처리는 이 컴퓨터 안에서 실행됩니다. 모델 다운로드 외에는 외부로 전송하지 않습니다.</div>
 <div class="card" style="margin-top:16px"><span class="tag ${h.ok?'ok':'bad'}">${h.ok?'WebGPU 사용 가능':'WebGPU 사용 불가'}</span>
 <span class="sub">${h.name}${h.ok?` · 최대 버퍼 ${h.buf.toFixed(1)}GB`:''}${h.mem?` · 메모리 약 ${h.mem}GB`:''}</span>
 ${h.ok?'':'<div class="sub" style="margin-top:6px">최신 Chrome/Edge 데스크톱에서 열어 주세요.</div>'}</div>
 <div class="grid"><button class="card big" data-k="chat">💬<b>대화</b><span class="sub">로컬 언어 모델과 채팅</span></button>
 <button class="card big" data-k="image">🎨<b>이미지 생성</b><span class="sub">프롬프트로 이미지 만들기</span></button></div>`;
 app.querySelectorAll('.big').forEach(b=>b.onclick=()=>pick(b.dataset.k));
}
async function pick(kind){
 killWorker(); // 모델 선택 화면에 들어오면 실행 중인 모델을 바로 종료해 GPU 메모리 해제
 st.kind=kind;const list=MODELS.filter(m=>m.kind===kind).sort((a,b)=>a.pri-b.pri);
 const states=await Promise.all(list.map(async m=>({m,f:fit(m),c:await cached(m)})));
 const lim=kind==='chat'?(st.hw.mem&&st.hw.mem<8?1:1.5):99; // 추천은 안정적으로 돌아갈 크기 안에서
 const rec=[...states].filter(s=>s.f==='ok'&&s.m.gb<=lim).pop();
 const mob=isMobile&&kind==='chat'?states.find(s=>s.f==='ok'):null;
 const recId=(isMobile&&mob?mob:rec)?.m.id;
 app.innerHTML=`<div class="top"><button class="btn ghost" id="bk">← 처음으로</button><h2>${kind==='chat'?'대화':'이미지 생성'} 모델 선택</h2></div>
 <div class="grid">${states.map(({m,f,c})=>`<div class="card model ${m.id===recId?'rec':''} ${f!=='ok'?'no':''}" data-id="${m.id}">
 <div><b>${m.name}</b></div><div>${m.id===recId?'<span class="tag rec">추천</span>':''}<span class="tag">${fmt(m.gb)}</span>
 <span class="tag ${f==='ok'?'ok':f==='low'?'warn':'bad'}">${f==='ok'?'실행 가능':f==='low'?'사양 부족 가능':'실행 불가'}</span>
 <span class="tag ${c?'ok':''}">${c?'저장됨':'미다운로드'}</span></div>
 <div class="sub">${m.desc}<br>언어: ${m.lang}<br>권장: WebGPU, 최대 버퍼 ${m.minBuf}GB 이상</div>${c?`<div class="row" style="justify-content:flex-end"><button class="btn ghost del" data-id="${m.id}">저장된 모델 삭제</button></div>`:''}</div>`).join('')}</div>`;
 $('#bk').onclick=home;
 app.querySelectorAll('.del').forEach(b=>b.onclick=async e=>{e.stopPropagation();const m=MODELS.find(x=>x.id===b.dataset.id);
  if(!confirm(`'${m.name}' 모델을 삭제할까요?\n저장된 파일(약 ${fmt(m.gb)})이 이 브라우저에서 지워지며, 다시 사용하려면 재다운로드해야 합니다.`))return;
  b.disabled=true;b.textContent='삭제 중…';await removeModel(m);pick(st.kind)});
 app.querySelectorAll('.model').forEach(el=>el.onclick=()=>{const m=MODELS.find(x=>x.id===el.dataset.id);
  if(!st.hw.ok)return alert('WebGPU를 사용할 수 없어 실행할 수 없습니다.');
  if(fit(m)!=='ok'&&!confirm('이 컴퓨터에서는 실행이 어려울 수 있습니다. 계속할까요?'))return;
  load(m)});
}
async function load(m){
 const c=await cached(m);
 if(isMobile&&!c&&!confirm(`모바일 환경으로 보입니다. 약 ${fmt(m.gb)}를 다운로드합니다. 모바일 데이터 요금에 주의하세요. 계속할까요?`))return;
 st.model=m;st.files={};st.rows={};killWorker();
 app.innerHTML=`<div class="top"><h2>${m.name} 준비 중</h2></div><div class="card"><div id="ph">${c?'저장된 모델을 불러오는 중…':'다운로드 중…'}</div>
 <div class="bar" id="br"><i></i></div><div class="sub" id="pf">연결 중…</div><div class="fl" id="fl"></div><div class="row" style="margin-top:12px"><button class="btn ghost" id="cn">취소</button></div></div>`;
 $('#cn').onclick=()=>pick(m.kind);
 const w=st.worker=spawn();
 w.onerror=e=>fail('Worker 오류: '+(e.message||'불러오기 실패'));
 w.onmessage=({data:d})=>{
  if(d.type==='prog'){const p=d.p;frow(p);
   if(p.file&&p.total){st.files[p.file]={l:p.loaded,t:p.total};
    const v=Object.values(st.files),l=v.reduce((a,b)=>a+b.l,0),t=v.reduce((a,b)=>a+b.t,0);
    $('#br').classList.remove('ind');$('#br i').style.width=(l/t*100)+'%';
    $('#pf').textContent=`${p.file.split('/').pop()} · 전체 ${(l/2**20).toFixed(0)} / ${(t/2**20).toFixed(0)}MB`}
   else if(p.status==='ready'||p.status==='done'){}}
  else if(d.type==='ready')m.kind==='chat'?chat():imgView();
  else if(d.type==='err')fail(d.msg);
 };
 w.postMessage({type:'load',kind:m.kind,repo:m.repo,dtype:m.dtype});
 $('#br').classList.add('ind');setTimeout(()=>{if(st.worker===w&&!Object.keys(st.files).length)$('#ph').textContent+=' (GPU 초기화 중일 수 있음)'},8000);
}
function frow(p){const f=p.file;if(!f)return;let r=st.rows[f];
 if(!r){r=st.rows[f]=document.createElement('div');r.className='fr';r.title=f;
  r.innerHTML='<div class="row"><span class="fn grow"></span><span class="fs sub">대기 중</span></div><div class="bar"><i></i></div>';
  r.querySelector('.fn').textContent=f.split('/').pop();$('#fl').append(r)}
 const fs=r.querySelector('.fs'),i=r.querySelector('i');
 if(p.status==='progress'&&p.total){const pc=Math.floor(p.loaded/p.total*100);i.style.width=pc+'%';fs.textContent=`${pc}% · ${(p.loaded/2**20).toFixed(1)}/${(p.total/2**20).toFixed(1)}MB`;r.classList.remove('dn')}
 else if(p.status==='done'){i.style.width='100%';fs.textContent='완료';r.classList.add('dn')}}
function fail(msg){killWorker();app.innerHTML=`<div class="card"><b>오류</b><p class="sub">${msg.replace(/</g,'&lt;')}</p><button class="btn" id="bk">모델 선택으로</button></div>`;$('#bk').onclick=()=>pick(st.kind)}

function head(t,x=''){return `<div class="top"><button class="btn ghost" id="bk">← 모델 변경</button><h2 class="grow">${t}</h2><span class="tag ok">${st.model.name}</span>${x}</div>`}

function chat(){
 st.hist=[];
 app.innerHTML=head('대화','<button class="btn ghost" id="nw">새 대화</button><button class="btn ghost" id="gr">설정</button>')+`<div class="tkw"><div class="sub" id="tkn">토큰 계산 중…</div><div class="bar" style="height:5px;margin:4px 0 8px"><i id="tkb"></i></div></div><div id="set" class="card"><label class="sub">시스템 프롬프트</label><textarea id="sy" rows="2"></textarea>
 <label class="sub">최대 답변 길이(토큰)</label><input type="number" id="mx" min="64" max="2048" step="64"></div>
 <div id="msgs"></div><div class="comp"><textarea id="in" rows="1" placeholder="메시지 입력 (Shift+Enter 줄바꿈)"></textarea><button class="circ" id="sd" title="전송">↑</button></div>`;
 $('#sy').value=st.sys;$('#mx').value=st.max;
 $('#bk').onclick=()=>pick('chat');$('#gr').onclick=()=>$('#set').classList.toggle('on');
 $('#sy').oninput=e=>{st.sys=e.target.value;clearTimeout(ct);ct=setTimeout(count,150)};$('#mx').onchange=e=>st.max=Math.min(2048,Math.max(64,+e.target.value||512));
 $('#nw').onclick=()=>{if(st.busy)stop();st.hist=[];$('#msgs').innerHTML='';count()};
 const send=()=>{if(st.busy)return stop();const t=$('#in').value.trim();if(!t)return;$('#in').value='';$('#in').style.height='auto';
  add('u',t);st.hist.push({role:'user',content:t});const el=mkA();let acc='';st.busy=true;$('#sd').textContent='■';
  const w=st.worker;
  w.onmessage=({data:d})=>{
   if(d.type==='n')tk(d.n);
   else if(d.type==='tok'){acc+=d.t;paint(el,acc)}
   else if(d.type==='done'){fin(el);st.hist.push({role:'assistant',content:parse(acc).an});end()}
   else if(d.type==='err'){el.querySelector('.ans').textContent='오류: '+d.msg;end()}};
  w.postMessage({type:'chat',noThink:st.model.noThink,max:st.max,messages:[{role:'system',content:st.sys},...st.hist]})};
 const end=()=>{st.busy=false;$('#sd').textContent='↑';st.worker.onmessage=idle;count()};
 const stop=()=>st.worker&&st.worker.postMessage({type:'stop'});
 $('#in').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,160)+'px';clearTimeout(ct);ct=setTimeout(count,150)};$('#sd').onclick=send;st.worker.onmessage=idle;count();$('#in').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
 var ct;
 function idle({data:d}){if(d.type==='cnt')tk(d.n)}
 function tk(n){const c=st.model.ctx||4096,r=n/c;$('#tkn').textContent=`현재 사용 중 ${n.toLocaleString()} 토큰 / 기준 ${c.toLocaleString()}`;const b=$('#tkb');b.style.width=Math.min(100,r*100)+'%';b.style.background=r>.95?'var(--bad)':r>.8?'var(--warn)':'var(--ac)'}
 function count(){if(st.busy||!st.worker)return;st.worker.postMessage({type:'count',noThink:st.model.noThink,messages:[{role:'system',content:st.sys},...st.hist],draft:$('#in').value})}
 function mkA(){const d=document.createElement('div');d.className='m a';d.innerHTML='<details class="th" hidden><summary></summary><div class="tb"></div></details><div class="ans">…</div>';$('#msgs').append(d);$('#msgs').scrollTop=1e9;return d}
 function parse(t){let th='',an=t,open=false,has=false;const b0=t.indexOf('<think>');
  if(b0>=0||st.model.think){has=true;const b=b0>=0?b0+7:0,e=t.indexOf('</think>',b);
   if(e>=0){th=t.slice(b,e);an=(b0>0?t.slice(0,b0):'')+t.slice(e+8)}else{th=t.slice(b);an='';open=true}}
  return{th:th.trim(),an:an.trim(),open,has}}
 function paint(el,t){const r=parse(t),dt=el.firstChild,sm=dt.firstChild,tb=dt.lastChild;
  if(r.has){dt.hidden=false;tb.textContent=r.th;
   if(r.open){if(!el._t){el._t=Date.now();dt.open=true}dt.classList.add('on');sm.textContent='생각 중…';tb.scrollTop=1e9}
   else{if(!el._c){el._c=1;dt.open=false;el._d=el._t?((Date.now()-el._t)/1000).toFixed(1):0}dt.classList.remove('on');sm.textContent='생각 과정'+(el._d?` · ${el._d}초`:'')}}
  el.lastChild.textContent=r.an||(r.open?'':'…');$('#msgs').scrollTop=1e9}
 function fin(el){const dt=el.firstChild;dt.classList.remove('on');if(dt.firstChild.textContent==='생각 중…')dt.firstChild.textContent='생각 과정'}
 function add(c,t){const d=document.createElement('div');d.className='m '+c;d.textContent=t;$('#msgs').append(d);$('#msgs').scrollTop=1e9;return d}
}

function imgView(){
 app.innerHTML=head('이미지 생성')+`<div class="two">
 <div class="card pa"><b>프롬프트</b><textarea id="pr" rows="4" style="margin-top:8px" placeholder="만들 이미지를 영어로 설명하세요. 예: a cute baby fox in a forest, watercolor"></textarea>
 <div class="row" style="margin-top:10px"><button class="btn" id="go">이미지 생성</button><span class="sub" id="tm"></span></div></div>
 <div class="card ga"><b>이전 이미지</b><div class="gal" id="gl" style="margin-top:8px"></div><div class="sub" id="ge">아직 생성한 이미지가 없습니다</div></div>
 <div class="card ra"><b>생성 결과</b><div class="ph" id="ph">생성된 이미지가 여기에 표시됩니다</div><div class="bar ind" id="gb" style="display:none"><i></i></div><img id="out" alt="" style="display:none"><button class="btn" id="sv" disabled>PNG 저장</button></div></div>`;
 $('#bk').onclick=()=>pick('image');
 const show=u=>{$('#out').src=u;$('#out').style.display='block';$('#ph').style.display='none';$('#sv').disabled=false};
 const gal=()=>{$('#gl').innerHTML='';$('#ge').style.display=st.gal.length?'none':'block';st.gal.forEach(u=>{const i=new Image();i.src=u;i.onclick=()=>show(u);$('#gl').append(i)})};gal();
 $('#sv').onclick=()=>{const a=document.createElement('a');a.href=$('#out').src;a.download='image-'+Date.now()+'.png';a.click()};
 $('#go').onclick=()=>{const p=$('#pr').value.trim();if(!p||st.busy)return;st.busy=true;$('#go').disabled=true;$('#gb').style.display='block';
  const t0=Date.now(),iv=setInterval(()=>$('#tm').textContent='생성 중… '+Math.round((Date.now()-t0)/1000)+'초',1000);
  const done=()=>{clearInterval(iv);st.busy=false;$('#go').disabled=false;$('#gb').style.display='none'};
  st.worker.onmessage=({data:d})=>{
   if(d.type==='img'){const u=URL.createObjectURL(d.blob);st.gal.unshift(u);show(u);gal();$('#tm').textContent='완료';done()}
   else if(d.type==='err'){$('#tm').textContent='오류: '+d.msg;done()}};
  st.worker.postMessage({type:'image',prompt:p})};
}
home();
</script></body></html>
