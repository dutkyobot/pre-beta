<!DOCTYPE html>
<html>
<body>
  <input type="text" id="urlInput" placeholder="주소 입력 (예: naver.com)">
  <button onclick="go()">이동</button>

  <script>
    function go() {
      let url = document.getElementById("urlInput").value.trim();
      if (!url) return;
      
      // http:// 또는 https://가 없으면 자동으로 붙여줌
      if (!url.startsWith("http://") && !url.startsWith("https://")) {
        url = "https://" + url;
      }
      
      window.location.href = url;
    }
  </script>
</body>
</html>
